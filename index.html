<style>
  /* ============ HX TOKENS — mockup contract (see docs/ui-contract.md) ============
     Dark is the target look. It becomes the default only after every screen is migrated (Phase 6);
     until then the app boots light, so no unconverted screen is ever shown half-themed. */
  :root{
    color-scheme:light;
    --hx-canvas:#f4f3ee;
    --hx-surface:#ffffff;
    --hx-surface-2:#f5f4ef;
    --hx-surface-3:#eeede6;
    --hx-ink:#141815;
    --hx-ink-2:#4e5750;
    --hx-ink-3:#6b756d;
    --hx-mint:#34d375;
    --hx-mint-deep:#15803d;
    --hx-mint-soft:rgba(52,211,117,.12);
    --hx-mint-line:rgba(21,128,61,.30);
    --hx-mint-pill-a:#98f3b4;
    --hx-mint-pill-b:#68dc8c;
    --hx-mint-cta-a:#8cf0ac;
    --hx-mint-cta-b:#45cc73;
    --hx-mint-dock-a:#96f5b2;
    --hx-mint-dock-b:#4ae07d;
    --hx-on-mint:#072210;
    --hx-line:rgba(20,24,21,.08);
    --hx-line-soft:rgba(20,24,21,.05);
    --hx-warn:#946118;
    --hx-warn-bg:rgba(214,158,45,.13);
    --hx-warn-line:rgba(214,158,45,.26);
    --hx-rose:#b04a42;
    --hx-rose-bg:rgba(217,105,92,.12);
    --hx-rose-line:rgba(217,105,92,.25);
    --hx-danger:#dc3522;
    --hx-hero-bg:linear-gradient(165deg,#ffffff 0%,#f7f6f1 100%);
    --hx-hero-ink:#141815;
    --hx-hero-sub:#545b53;
    --hx-glass-bg:linear-gradient(160deg,rgba(255,255,255,.94),rgba(255,255,255,.80));
    --hx-glass-border:rgba(20,24,21,.08);
    --hx-glass-shadow:0 10px 28px -20px rgba(18,38,26,.35),inset 0 1px 0 #ffffff;
    --hx-field-bg:#ffffff;
    --hx-field-border:rgba(20,24,21,.55);
    --hx-field-ring:rgba(52,211,117,.22);
    --hx-dock:rgba(255,255,255,.90);
    --hx-dock-line:rgba(20,24,21,.08);
    --hx-dock-shadow:0 16px 36px rgba(18,38,26,.10);
    --hx-r-hero:28px;
    --hx-r-card:22px;
    --hx-r-field:16px;
  }
  html[data-theme=dark]{
    color-scheme:dark;
    --hx-canvas:#0b0e0c;
    --hx-surface:#171b18;
    --hx-surface-2:#121614;
    --hx-surface-3:#1d221e;
    --hx-ink:#f5f7f5;
    --hx-ink-2:rgba(245,247,245,.72);
    --hx-ink-3:rgba(245,247,245,.58);
    --hx-mint:#34d375;
    --hx-mint-deep:#6ee7a0;
    --hx-mint-soft:rgba(52,211,117,.14);
    --hx-mint-line:rgba(52,211,117,.40);
    --hx-on-mint:#072210;
    --hx-line:rgba(255,255,255,.10);
    --hx-line-soft:rgba(255,255,255,.06);
    --hx-warn:#fbbf24;
    --hx-warn-bg:rgba(245,158,11,.15);
    --hx-warn-line:rgba(245,158,11,.30);
    --hx-rose:#f87171;
    --hx-rose-bg:rgba(244,63,94,.15);
    --hx-rose-line:rgba(244,63,94,.30);
    --hx-danger:#ff6b5e;
    --hx-hero-bg:linear-gradient(165deg,#121614 0%,#0e1210 100%);
    --hx-hero-ink:#f5f7f5;
    --hx-hero-sub:rgba(245,247,245,.72);
    --hx-glass-bg:linear-gradient(165deg,#181a19 0%,#111312 100%);
    --hx-glass-border:rgba(255,255,255,.09);
    --hx-glass-shadow:0 18px 40px -26px rgba(0,0,0,.85),inset 0 1px 0 rgba(255,255,255,.08);
    --hx-field-bg:rgba(255,255,255,.05);
    --hx-field-border:rgba(255,255,255,.45);
    --hx-field-ring:rgba(52,211,117,.20);
    --hx-dock:rgba(16,22,18,.88);
    --hx-dock-line:rgba(255,255,255,.12);
    --hx-dock-shadow:0 20px 44px rgba(0,0,0,.70);
  }

  /* ============ BASE ============ */
  *{-webkit-tap-highlight-color:transparent}
  html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  body{
    margin:0;
    background:var(--hx-canvas);
    color:var(--hx-ink);
    font-family:Inter,system-ui,sans-serif;
    overflow-x:hidden;
    transition:background-color .3s ease,color .3s ease;
  }
  input[type=number]::-webkit-outer-spin-button,input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  input[type=number]{-moz-appearance:textfield}
  input[type=range]{accent-color:var(--hx-mint-deep);height:22px}
  .no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}

  /* ============ AMBIENT BACKGROUND ============ */
  /* Removed in the mockup rebuild: flat screens, no drifting layers. */

  /* ============ GLASS SYSTEM ============ */
  /* No backdrop-filter on cards: opaque mockup surfaces, and no per-frame blur cost. */
  .glass{
    background:var(--hx-glass-bg);
    border:1px solid var(--hx-glass-border);
    box-shadow:var(--hx-glass-shadow);
    border-radius:24px;
  }
  .glass-thin{
    background:var(--hx-surface-2);
    border:1px solid var(--hx-line);
    box-shadow:0 10px 26px -22px rgba(18,38,26,.35),inset 0 1px 0 rgba(255,255,255,.9);
    border-radius:20px;
  }

  /* ============ TYPE ============ */
  .microlabel{font-size:.63rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--hx-ink-3)}
  .display{font-family:'Plus Jakarta Sans',Inter,sans-serif;font-weight:800;letter-spacing:-.02em}
  .mono{font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}

  /* ============ CHIPS ============ */
  .chip{display:inline-flex;align-items:center;gap:.25rem;border-radius:9999px;padding:3px 9px;
        font-size:10px;line-height:1.2;font-weight:800;white-space:nowrap;letter-spacing:.01em;
        transition:background-color .3s,color .3s,border-color .3s}
  .chip-ok{background:var(--hx-mint-soft);border:1px solid var(--hx-mint-line);color:var(--hx-mint-deep)}
  .chip-watch{background:var(--hx-warn-bg);border:1px solid var(--hx-warn-line);color:var(--hx-warn)}
  .chip-flag{background:var(--hx-rose-bg);border:1px solid var(--hx-rose-line);color:var(--hx-rose)}
  .chip-none{background:var(--hx-line-soft);border:1px solid var(--hx-line);color:var(--hx-ink-3)}

  /* ============ BUTTONS ============ */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;
       font-weight:800;border-radius:16px;border:0;cursor:pointer;color:var(--hx-ink);
       transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .3s,background-color .3s,color .3s;
       will-change:transform}
  .btn:active{transform:scale(.965)}
  .btn-primary{background:linear-gradient(180deg,#98f3b4,#68dc8c);color:var(--hx-on-mint);
       box-shadow:0 12px 24px -14px rgba(21,128,61,.55),inset 0 1px 0 rgba(255,255,255,.45)}
  .btn-primary:hover{box-shadow:0 16px 30px -14px rgba(21,128,61,.65)}
  .btn-glass{background:var(--hx-surface);border:1px solid var(--hx-line);color:var(--hx-ink);
       box-shadow:0 8px 20px -18px rgba(18,38,26,.5),inset 0 1px 0 rgba(255,255,255,.6)}
  .btn-glass:hover{background:var(--hx-surface-2)}
  .btn-soft{background:var(--hx-mint-soft);color:var(--hx-mint-deep);border:1px solid var(--hx-mint-line)}
  .btn-soft:hover{background:rgba(52,211,117,.18)}

  /* ============ FORM FIELDS ============ */
  .field{width:100%;border-radius:var(--hx-r-field);border:1px solid var(--hx-field-border);
         background:var(--hx-field-bg);padding:.7rem .9rem;font-size:1rem;color:var(--hx-ink);
         transition:border-color .25s,box-shadow .25s,background-color .25s}
  .field::placeholder{color:var(--hx-ink-3)}
  .field:focus{outline:none;border-color:var(--hx-mint);background:var(--hx-surface);box-shadow:0 0 0 4px var(--hx-field-ring)}

  /* ============ NAV ============ */
  .nav-item{position:relative;flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:2px;
            padding:.45rem .1rem;border-radius:16px;border:0;background:transparent;cursor:pointer;
            font-size:10.5px;font-weight:800;color:var(--hx-ink-3);
            transition:color .3s,background-color .35s cubic-bezier(.22,1,.36,1),transform .2s}
  .nav-item:active{transform:scale(.94)}
  .nav-item-active{color:var(--hx-mint-deep);background:var(--hx-mint-soft);
                   box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
  .nav-ico{position:relative;display:flex;align-items:center;justify-content:center;height:26px;width:40px;
           transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
  .nav-item-active .nav-ico{transform:translateY(-1px)}
  .nav-lbl{letter-spacing:.01em}
  .nav-badge{position:absolute;top:-3px;right:2px;border-radius:9999px;padding:0 5px;
             font-size:8px;font-weight:800;line-height:14px;color:var(--hx-on-mint);
             background:linear-gradient(180deg,#98f3b4,#68dc8c);box-shadow:0 2px 6px -2px rgba(21,128,61,.8)}
  .nav-badge-alert{background:linear-gradient(135deg,#ff8a7a,#dc3522);color:#fff;box-shadow:0 2px 6px -2px rgba(220,53,34,.7)}

  /* ============ TILES / METRICS ============ */
  .tile{flex:1 1 0;min-width:0;border-radius:16px;padding:.5rem .6rem;
        background:var(--hx-surface);border:1px solid var(--hx-line);
        box-shadow:inset 0 1px 0 rgba(255,255,255,.55);transition:background-color .3s,border-color .3s}
  .tile-l{display:block;font-size:9px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--hx-ink-3)}
  .tile-v{display:block;margin-top:3px;font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:14px;font-weight:700;color:var(--hx-ink);
          transition:color .3s}
  .tile-watch .tile-v{color:var(--hx-warn)}
  .tile-flag .tile-v{color:var(--hx-rose)}
  .tile-ok .tile-v{color:var(--hx-mint-deep)}

  /* ============ HERO ============ */
  .hero{position:relative;overflow:hidden;border-radius:var(--hx-r-hero);
        background:var(--hx-hero-bg);color:var(--hx-hero-ink);
        border:1px solid var(--hx-line);
        box-shadow:0 24px 50px -34px rgba(18,38,26,.45),inset 0 1px 0 rgba(255,255,255,.35)}

  /* ============ SIM PANEL ============ */
  .sim-panel{border-radius:22px;padding:1rem;
    background:var(--hx-surface-2);
    border:1px solid var(--hx-line);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 14px 32px -26px rgba(18,38,26,.5)}
  .bar-track{height:8px;border-radius:9999px;background:var(--hx-line-soft);overflow:hidden}
  .bar-fill{height:100%;border-radius:9999px;
    background:linear-gradient(90deg,#15803d,#34d375 60%,#98f3b4);
    transition:width .6s cubic-bezier(.22,1,.36,1)}

  /* ============ STEPPER ============ */
  .step-btn{display:flex;align-items:center;justify-content:center;flex:none;
    height:40px;width:40px;border-radius:14px;border:1px solid var(--hx-line);
    background:var(--hx-surface);color:var(--hx-ink-2);font-size:18px;font-weight:700;cursor:pointer;
    transition:transform .18s cubic-bezier(.22,1,.36,1),background-color .25s,box-shadow .25s}
  .step-btn:hover{background:var(--hx-surface-2);box-shadow:0 6px 16px -14px rgba(18,38,26,.6)}
  .step-btn:active{transform:scale(.9);background:var(--hx-mint-soft)}
  .step-input{width:100%;min-width:0;border-radius:14px;border:1px solid var(--hx-field-border);
    background:var(--hx-field-bg);padding:.6rem .3rem;text-align:center;
    font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:1rem;font-weight:700;color:var(--hx-ink);
    transition:border-color .25s,box-shadow .25s,background-color .25s}
  .step-input:focus{outline:none;border-color:var(--hx-mint);background:var(--hx-surface);box-shadow:0 0 0 4px var(--hx-field-ring)}

  /* ============ ANIMATIONS ============ */
  @keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
  .stagger>*{animation:rise .58s cubic-bezier(.22,1,.36,1) both}
  .stagger>*:nth-child(1){animation-delay:.01s}
  .stagger>*:nth-child(2){animation-delay:.06s}
  .stagger>*:nth-child(3){animation-delay:.11s}
  .stagger>*:nth-child(4){animation-delay:.16s}
  .stagger>*:nth-child(5){animation-delay:.21s}
  .stagger>*:nth-child(6){animation-delay:.26s}
  .stagger>*:nth-child(7){animation-delay:.31s}
  .stagger>*:nth-child(8){animation-delay:.36s}
  .stagger>*:nth-child(9){animation-delay:.41s}

  @keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
  .pop-in{animation:popIn .34s cubic-bezier(.34,1.4,.64,1) both}


  @keyframes sheetUp{from{opacity:0;transform:translateY(28px) scale(.985)}to{opacity:1;transform:none}}
  .sheet-up{animation:sheetUp .42s cubic-bezier(.22,1,.36,1) both}

  @keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
  .modal-in{animation:modalIn .38s cubic-bezier(.22,1,.36,1) both}



  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
      transition-duration:.001ms!important}
  }


  /* ============ A6 PRINT CARD ============ */
  #printArea{display:none}
  .pc-card{width:105mm;height:148mm;overflow:hidden;display:flex;flex-direction:column;background:#fff;color:#123033;
    font-family:Inter,Arial,sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pc-head{background:linear-gradient(135deg,#2b877c,#1f4d48);color:#fff;padding:4mm 6mm 3.5mm}
  .pc-head-row{display:flex;justify-content:space-between;align-items:flex-start}
  .pc-brand{font-family:'Plus Jakarta Sans',Inter,sans-serif;font-weight:800;font-size:12.5pt;letter-spacing:-.02em}
  .pc-sub{font-size:7pt;opacity:.85;margin-top:.5mm}
  .pc-name{font-weight:800;font-size:12pt;margin-top:2mm;line-height:1.1}
  .pc-meta{font-size:7.5pt;opacity:.9;margin-top:1mm;font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums}
  .pc-body{padding:3.2mm 6mm 4mm;display:flex;flex-direction:column;flex:1}
  .pc-sec-title{font-size:6.5pt;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#2b877c;margin:2.2mm 0 1.2mm}
  .pc-sec-title:first-child{margin-top:0}
  .pc-grid4{display:grid;grid-template-columns:1fr 1fr;gap:1.2mm}
  .pc-metric{border:1px solid #e2e8f0;border-radius:2mm;padding:1.1mm 2mm;display:flex;flex-direction:column;gap:.3mm}
  .pc-ml{font-size:6pt;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#64748b}
  .pc-mv{font-size:8.8pt;font-weight:700;font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;color:#123033}
  .pc-hot{background:#eefbf8;border-color:#bbeae2}
  .pc-hot .pc-mv{color:#1f6b62}
  .pc-habit{display:flex;gap:2mm;align-items:flex-start;margin-bottom:1mm;font-size:7.6pt;line-height:1.35;color:#334155}
  .pc-box{flex:none;width:3.6mm;height:3.6mm;border:1.4px solid #2b877c;border-radius:.8mm;margin-top:.4mm}
  .pc-problem{margin:0 0 1.2mm;font-size:7.6pt;font-weight:600;line-height:1.35;color:#123033}
  .pc-line{margin:.2mm 0 .8mm;font-size:7.2pt;line-height:1.35;color:#334155}
  .pc-foot{margin-top:auto;padding-top:1.5mm}
  .pc-safety{background:#fffaf0;border:1px solid #f6e3bb;border-radius:1.6mm;padding:1.4mm 2mm;font-size:6.6pt;line-height:1.35;color:#8a5a12}
  .pc-verse{margin-top:1.4mm;font-size:6.8pt;font-style:italic;color:#5c747a;line-height:1.4}
  .pc-bottom{margin-top:1.4mm;display:flex;justify-content:space-between;font-size:6.5pt;font-weight:700;color:#2b877c;
    border-top:1px solid #e2e8f0;padding-top:1.6mm}
  .pc-fit1 .pc-habit,.pc-fit1 .pc-problem,.pc-fit1 .pc-line{font-size:6.9pt}
  .pc-fit1 .pc-safety,.pc-fit1 .pc-verse{font-size:6pt}
  .pc-fit1 .pc-mv{font-size:8pt}
  .pc-fit2 .pc-habit,.pc-fit2 .pc-problem,.pc-fit2 .pc-line{font-size:6.4pt;margin-bottom:.6mm}
  .pc-fit2 .pc-sec-title{margin:1.4mm 0 .8mm}
  .pc-fit2 .pc-metric{padding:.8mm 1.6mm}
  @media print{
    @page{size:105mm 148mm;margin:0}
    body.print-mode>*{display:none!important}
    body.print-mode #printArea{display:block!important}
    html,body{background:#fff!important}
  }

  /* ============ v3 · LIQUID GLASS REFRESH ============ */
  :focus-visible{outline:2px solid #3f9d8f;outline-offset:2px}
  .field:focus-visible,.step-input:focus-visible{outline:none}

  .glass,.glass-thin,.hero{position:relative;isolation:isolate}
  .microlabel{font-size:.7rem;font-weight:700;letter-spacing:.015em;text-transform:none;color:var(--hx-ink)}
  .tile-l{font-size:10px;font-weight:700;letter-spacing:.015em;text-transform:none;color:#667d83}

  /* transform/opacity only: transitioning box-shadow, background and colour repainted every button on
     hover, focus and theme change. .45s also outlasted the tap, so a quick press felt loose. */
  .btn{position:relative;overflow:hidden;transition:transform .18s cubic-bezier(.34,1.56,.64,1),opacity .18s}
  .btn:active{transform:scale(.95);transition-duration:.08s}
  .step-btn{position:relative;overflow:hidden}
  .rip{position:absolute;border-radius:50%;pointer-events:none;transform:scale(0);
    background:radial-gradient(circle,rgba(255,255,255,.7),rgba(255,255,255,0) 70%);animation:ripple .7s cubic-bezier(.22,1,.36,1) forwards}
  .btn-glass .rip,.btn-soft .rip,.step-btn .rip{background:radial-gradient(circle,rgba(63,157,143,.3),rgba(63,157,143,0) 70%)}
  @keyframes ripple{to{transform:scale(1);opacity:0}}

  #navBar{border-radius:26px}
  .nav-pill{position:absolute;left:0;top:0;width:0;border-radius:19px;pointer-events:none;will-change:transform,width;
    background:linear-gradient(160deg,rgba(255,255,255,.96),rgba(206,236,228,.78));border:1px solid rgba(255,255,255,.95);
    box-shadow:0 10px 20px -12px rgba(43,128,116,.6),inset 0 1.5px 0 #fff,inset 0 -1px 0 rgba(63,157,143,.2)}
  .nav-item{z-index:1}
  .nav-item-active{background:none;box-shadow:none;color:#23695f}
