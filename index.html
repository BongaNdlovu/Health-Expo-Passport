 cloud.viewEmail=em;
 if(!name){gateFail('Enter your name so the administrator knows who you are.');return;}
 if(!validEmail(em)){gateFail('That email address does not look right.');return;}
 const bad=passwordProblem(pw);
 if(bad){gateFail(bad);return;}
 if(pw!==pw2){gateFail('The two passwords do not match.');return;}
 gateBusy('gate','Creating account…');
 let res;
 try{res=await cloud.client.auth.signUp({email:em,password:pw,options:{data:{full_name:name},emailRedirectTo:authRedirect()}});}catch(err){res={error:err};}
 if(res.error){
  const m=String(res.error.message||''),c=res.error.code||'';
  gateFail(c==='signup_disabled'||/signups? not allowed/i.test(m)?'Creating accounts is switched off for this project. Ask the administrator to add you.'
   :c==='weak_password'?m
   :c==='user_already_exists'||/already registered/i.test(m)?'That email already has an account — sign in, or reset your password.'
   :c==='over_email_send_rate_limit'||res.error.status===429||/rate limit/i.test(m)?'Too many emails were sent just now. Wait a few minutes and try again.'
   :isNet(m)?'No connection — try again when you are online.':(m||'Could not create the account.'));

 }

 /* with e-mail confirmation on, signing up an address that already exists returns a user with no identities */
 if(u&&Array.isArray(u.identities)&&u.identities.length===0){gateFail('That email already has an account — sign in, or reset your password.');return;}

 if(res.data&&res.data.session)return;                 /* confirmation is switched off: the sign-in event takes over */

/* ---------- cloud status: one record per cloud function ----------
   Each row says what just happened to that function: a request that worked or failed, a live connection's own report,
   or Test now. Nothing is guessed; a row nobody has checked says so. The panel behind the logo lists every row, Home
   shows the worst of download / upload / live updates, and the queue and account screens point here when they fail. */
const HEALTH_ROWS=[['auth','Sign-in'],['sync','Download'],['upload','Upload'],['live','Live updates'],['queue','Live queue'],
 ['account','Accounts & admin'],['schema','Database setup']];
const H_TONE={ok:'live',warn:'warn',bad:'bad',off:'info'};
const H_RANK={bad:3,warn:2,off:1,ok:0};
const health={};
const hhmm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
const isOfflineErr=m=>!navigator.onLine||/failed to fetch|networkerror|load failed|network request/i.test(String(m||''));
const isMissingErr=e=>!!e&&(e.code==='PGRST205'||e.code==='PGRST202'||e.code==='42P01'||e.code==='42883'||/schema cache|could not find the (table|function)|does not exist/i.test(String(e.message||'')));
/* "Could not find the table 'public.queue_entries' …" / "… function public.my_account …" / relation "x" -> the name */
const missingName=e=>{const m=/(?:public\.|relation\s+")([a-z_]+)/i.exec(String((e&&e.message)||''));return m?m[1]:'';};
let _healthT=null;
function noteHealth(key,st,msg,detail){
 health[key]={st,msg,detail:detail||'',at:Date.now()};
 clearTimeout(_healthT);_healthT=setTimeout(healthRefresh,60);
}
function healthReset(){for(const k in health)delete health[k];cloud.testedAt=0;}
/* a failed request, in plain words; a missing table or function also marks Database setup */
function healthFromError(key,err,what){
 const msg=String((err&&err.message)||err||''),name=what||missingName(err);
 if(isOfflineErr(msg))return noteHealth(key,'warn','No connection. It retries by itself; changes stay on this phone.',msg);
 if(isMissingErr(err)){
  noteHealth('schema','bad',`Missing in the database: ${name||'a table or function'}. Run supabase/schema.sql again in the Supabase SQL editor.`,msg);
  return noteHealth(key,'bad','Not set up in the database yet (see Database setup).',msg);
 }
 if(err&&(err.code==='42501'||/row-level security|permission denied/i.test(msg)))return noteHealth(key,'bad','Refused: this account has no access to it.',msg);
 noteHealth(key,'bad',msg||'Failed for an unknown reason.',[err&&err.code,what].filter(Boolean).join(' · '));
}
/* what is waiting to upload, counted from this phone's own copy */
function healthUpload(){
 const n=cloudPending(),bad=Object.keys(cloud.rejected).length;
 if(bad)return noteHealth('upload','warn',`${bad} change${bad>1?'s were':' was'} refused by the database and will not upload. The reason was shown when it happened.`);
 noteHealth('upload',n?'warn':'ok',n?`${n} change${n>1?'s':''} waiting to upload.`:'Every change on this phone is uploaded.');
}
/* the live connections report their own state: SUBSCRIBED, or CHANNEL_ERROR / TIMED_OUT / CLOSED while reconnecting */
function healthLive(key,st){
 if(st==='SUBSCRIBED')return noteHealth(key,'ok',key==='queue'?'Live: every desk sees the same line.':'Connected: changes from other desks arrive straight away.',st);
 if(!st)return noteHealth(key,'warn','Connecting the live updates…','no status reported yet');
 noteHealth(key,'warn',key==='queue'?'Reconnecting… numbers may be a few seconds behind.':'Reconnecting… other desks’ changes still arrive at the next sync (within 10 minutes).',st||'connecting');
}
function healthRefresh(){
 const m=$('#cloudModal');if(m&&!m.classList.contains('hidden'))renderCloudBody();
 const h=$('#homeHealth');if(h)h.innerHTML=homeHealthHTML();
 for(const id of ['acctHealth','gateHealth']){const e=$('#'+id);if(e)e.innerHTML=acctHealthHTML();}
}
/* the panel behind the logo */
function statusPanelHTML(){
 return `<div class="mt-4 rounded-[18px] border border-[#123033]/[.07] bg-white/60 p-3.5">
  <div class="flex items-center justify-between"><div class="microlabel">Cloud status</div>
   <button class="tap-link" onclick="healthTest()" ${cloud.testing?'disabled':''}>${cloud.testing?'Testing…':'Test now'}</button></div>
  ${HEALTH_ROWS.map(([k,l])=>{const h=health[k];
   return `<div class="q-state q-state-${h?H_TONE[h.st]:'info'} mt-2"><span class="q-dot"></span><span style="flex:1"><b>${l}</b> · ${h?esc(h.msg):'Not checked yet.'}${h&&h.detail&&h.st!=='ok'?`<span class="mono mt-0.5 block text-[10px]">${esc(h.detail)}</span>`:''}</span><span class="text-[10px]">${h?hhmm(h.at):''}</span></div>`;}).join('')}
  <p class="mt-2 text-[10px] leading-relaxed text-[#8a9aa0]">${cloud.testedAt?`Test now ran at ${hhmm(cloud.testedAt)}. `:''}Test now only reads (one row of each table, and read-only functions); it never changes data.</p>
 </div>`;
}
/* Home: the worst of download, upload and live updates, one tap from the details */
function homeHealthHTML(){
 const rows=['sync','upload','live'].map(k=>health[k]).filter(Boolean);
 if(!rows.length)return '';
 const w=rows.reduce((a,b)=>H_RANK[b.st]>H_RANK[a.st]?b:a);
 return `<button onclick="openCloud()" class="q-state q-state-${H_TONE[w.st]} mb-2 w-full text-left"><span class="q-dot"></span><span class="min-w-0 flex-1 truncate">${w.st==='ok'?'Up to date with the shared database':esc(w.msg)}</span><span>Details</span></button>`;
}
/* the account screens: only when an account call is failing */
function acctHealthHTML(){
 const h=health.account;
 if(!h||h.st==='ok'||h.st==='off')return '';
 return `<button onclick="openCloud()" class="q-state q-state-${H_TONE[h.st]} mb-2.5 w-full text-left"><span class="q-dot"></span><span class="min-w-0 flex-1">${esc(h.msg)}</span><span>Details</span></button>`;

/* Test now: read-only checks of each function, one after another, each recorded with its time */
async function healthTest(){
 if(!cloud.client||!cloud.user){noteHealth('auth','off','Not signed in. Sign in to test the shared database.');return;}
 if(cloud.testing)return;
 cloud.testing=true;renderCloudBody();
 const missing=[];let unreached=0;
 const probe=async(key,what,run)=>{
  let r;
  try{r=await run();}catch(e){r={error:e};}
  if(r&&r.error){if(isMissingErr(r.error))missing.push(what);else unreached++;healthFromError(key,r.error,what);return null;}
  return r||{};
 };
 noteHealth('auth','ok','Signed in as '+(cloud.user.email||''));
 const a=await probe('sync','attendees',()=>cloud.client.from('attendees').select('id').range(0,0));
 const v=await probe('sync','volunteers',()=>cloud.client.from('volunteers').select('id').range(0,0));
 if(a&&v)noteHealth('sync','ok','Reading visitors and volunteers works.');
 const qc=await probe('queue','queue_now',()=>cloud.client.rpc('queue_now'));
 const qt=await probe('queue','queue_entries',()=>cloud.client.from('queue_entries').select('id').range(0,0));
 if(qc&&qt)healthLive('queue',qs.rt||'');
 const me=await probe('account','my_account',()=>cloud.client.rpc('my_account'));
 if(me&&me.data&&typeof me.data==='object')noteHealth('account','ok','Account functions answer.');
 else if(me){missing.push('my_account (churches part)');noteHealth('account','warn','Churches are not set up in this database. Until schema.sql is run again, the old staff list decides who gets in.');}
 healthUpload();
 if(cloud.channel)healthLive('live',cloud.liveSt||'');else noteHealth('live','off','Not connected (connects after the first download).');
 if(missing.length)noteHealth('schema','bad',`Missing in the database: ${missing.join(', ')}. Run supabase/schema.sql again in the Supabase SQL editor.`);
 else if(unreached)noteHealth('schema','warn',`Could not be checked: ${unreached} request${unreached>1?'s':''} failed for another reason (see the rows above).`);
 else noteHealth('schema','ok','Every table and function Test now checks was found: attendees, volunteers, queue_entries, queue_now, my_account.');
 cloud.testing=false;cloud.testedAt=Date.now();
 healthRefresh();renderCloudBody();toast(missing.length?'Cloud test finished: something is missing (see Database setup)':'Cloud test finished');
}

/* ---------- churches, members and the platform admin ----------
   With the CHURCHES part of supabase/schema.sql every account belongs to one church. Staff and admins of an active church
   use the expo app as before, on that church's data only. Everyone else who signs in gets an account screen instead:
   choose or register a church, wait for approval, or (as an approved member) edit their details and see their own
   screening results. Church admins manage their members from the account sheet; the platform admin also gets an Admin tab
   with every church. The database checks every one of these actions; the screens only call its functions.
   A database without the CHURCHES part has no my_account function: the app then works exactly as it did before. */
const CHURCH_KEY='newstart.church.v1';               /* which church the data saved on this device belongs to */
const ACCT_GATES=['church','churchwait','suspended','pending','member'];
const ROLE_L={member:'Member',staff:'Staff',admin:'Church admin'};
const CHURCH_L={pending:'Waiting',active:'Active',suspended:'Paused'};
const ACCT_MSG={church:'Choose your church to continue.',churchwait:'Your church is waiting for the Health Expo admin’s approval.',
 suspended:'Your church has been paused by the Health Expo admin.',pending:'Your church has not approved this account yet.',
 member:'Members see their own account. Visitor and volunteer data is for church staff.'};
/* a badge number is only unique inside its church, so uploads name the church */
const inChurch=r=>cloud.churchId?{...r,church_id:cloud.churchId}:r;
const conflictOn=()=>cloud.churchId?'church_id,id':'id';
const isChurchAdmin=()=>{const m=cloud.acct&&cloud.acct.membership;return !!m&&m.role==='admin'&&m.status==='approved';};
/* who is signed in; true when they are staff of an active church (the expo app opens) */
async function loadAccount(){
 const r=await cloud.client.rpc('my_account');
 if(r.error||!r.data||typeof r.data!=='object'){         /* no churches in this database yet: the old staff check decides */
  cloud.acct=null;cloud.churchId='';
  if(!r.error||!isOfflineErr(r.error.message))noteHealth('account','warn','Churches are not set up in this database. Until schema.sql is run again, the old staff list decides who gets in.',r.error?String(r.error.message||''):'my_account gave no account');
  const chk=await cloud.client.rpc('is_staff');
  if(chk.error)throw chk.error;
  return chk.data===true;
 }
 cloud.acct=r.data;cloud.acctV++;cloud.health=undefined;          /* Check again also reloads the member's results */
 const m=r.data.membership,c=r.data.church;
 cloud.churchId=c?c.id:'';
 noteHealth('account','ok',c&&m?`${c.name} · ${ROLE_L[m.role]}${m.status==='approved'?'':' (waiting for approval)'}`:'Signed in, not in a church yet.');
 return !!(m&&c&&m.status==='approved'&&m.role!=='member'&&c.status==='active');
}
/* the account screen a signed-in person without expo access sees */
function acctGate(){
 const a=cloud.acct;if(!a)return '';
 const m=a.membership,c=a.church;
 if(!m||!c)return 'church';
 if(c.status==='suspended')return 'suspended';
 if(c.status!=='active')return 'churchwait';
 if(m.status!=='approved')return 'pending';
 return 'member';
}
/* forget the church data saved on this device (another church's account, or no longer staff) */
function dropChurchData(){
 attendees.length=0;volunteers.length=0;
 cloud.synced={att:{},vol:{}};cloud.rejected={};cloud.since={att:'',vol:''};cloud.lastFull=0;
 queueReset();
 try{localStorage.removeItem(SYNC_KEY);localStorage.removeItem(CHURCH_KEY);}catch(e){}
 _ledgerSig='';afterMerge();persistNow();
}
/* Staff of a church: the saved copy must be that church's. One saved for another church is cleared first, never
   uploaded: the database would file its rows under the new church. */
function adoptChurch(id){

async function acctRpc(fn,args,done){

 const a=rowToAtt(cloud.health),s=a.s,b=bmi(a),has=v=>v!=null&&v!=='';

/* ---------- pull, merge, push ---------- */
function cloudError(err,where){
 console.warn('cloud sync:',err);
 healthFromError(where||'sync',err);
 if(where!=='upload'&&isOfflineErr(err&&err.message))healthUpload();
 const msg=String((err&&err.message)||err||'');
 if(!navigator.onLine||/failed to fetch|networkerror|load failed|network request/i.test(msg)){
  setCloud('offline');clearTimeout(cloud.retryT);cloud.retryT=setTimeout(()=>cloudSync(),20000);return;
 }
 if(err&&(err.code==='PGRST205'||err.code==='PGRST202'||/schema cache|could not find the (table|function)/i.test(msg)))
  {cloud.blocked=true;setCloud('error','The database tables are not set up yet. Run supabase/schema.sql in the Supabase SQL editor.');return;}
 if(err&&(err.code==='42501'||/row-level security|permission denied/i.test(msg)))
  {cloud.blocked=true;setCloud('error','This sign-in is not on the staff list yet. Ask the administrator to add it (step 3 at the bottom of supabase/schema.sql).');return;}
 setCloud('error',msg||'Sync failed');
 clearTimeout(cloud.retryT);cloud.retryT=setTimeout(()=>cloudSync(),60000);
}
async function cloudSync(manual){
 if(!cloud.client||!cloud.user)return;
 if(cloud.busy){cloud.again=true;return;}
 if(manual)cloud.blocked=false;
 cloud.busy=true;setCloud('syncing');
 try{
  if(!await loadAccount()){
   cloud.blocked=true;cloud.pending=true;
   noteHealth('sync','off','This account has no expo data access, so nothing is downloaded.');noteHealth('upload','off','Nothing to upload for this account.');
   if(cloud.acct){dropChurchData();cloud.ready=false;}      /* the database says no expo access: the saved copy goes too */
   setCloud('error',cloud.acct?ACCT_MSG[acctGate()]:'This account is not approved yet. Ask the administrator to add it to the staff list (see supabase/README.md).');return;
  }
  cloud.pending=false;
  if(cloud.acct)adoptChurch(cloud.churchId);
  /* A full pull on sign-in, "Sync now" and every 10 minutes (it is the only way to notice rows deleted on another
     desk); in between, only rows changed since the last pull. */
  const full=!!manual||!cloud.lastFull||Date.now()-cloud.lastFull>600000;
  const [ra,rv]=await Promise.all([fetchRows('attendees',full?'':cloud.since.att),fetchRows('volunteers',full?'':cloud.since.vol)]);
  const changed=mergeRemote('att',ra,full)|mergeRemote('vol',rv,full);
  noteSince('att',ra);noteSince('vol',rv);
  if(full)cloud.lastFull=Date.now();
  await pushDirty();
  afterMerge();saveSynced();persistNow();
  startRealtime();
  queueSync();                    /* separate from the visitor sync: a queue problem must never block it */
  setCloud('online');noteHealth('sync','ok',`Up to date: ${attendees.length} visitors, ${volunteers.length} volunteers.`);healthUpload();
  if(changed||manual)cloudRefresh();
 }catch(err){cloudError(err);}
 finally{
  cloud.busy=false;
  if(cloud.status==='online')cloud.ready=true;      /* the first successful sync lifts the sign-in gate */
  renderGate();
  if(cloud.again){cloud.again=false;cloudQueuePush();}
 }
}
/* Supabase answers at most 1000 rows per request, so read in pages. Reading everything in one request
   would silently stop at row 1000 and the merge below would then treat every later visitor as deleted. */
async function fetchRows(table,since){
 const PAGE=500,rows=[];
 for(let page=0;page<400;page++){
  let q=cloud.client.from(table).select('*');
  q=since?q.gte('updated_at',since).order('updated_at').order('id'):q.order('created_at').order('id');
  const {data,error}=await q.range(page*PAGE,page*PAGE+PAGE-1);
  if(error)throw error;
  rows.push(...data);
  if(data.length<PAGE)return rows;
 }
 throw new Error('Too many rows to sync in one go');
}
function noteSince(kind,rows){for(const r of rows)if(r.updated_at&&r.updated_at>cloud.since[kind])cloud.since[kind]=r.updated_at;}
/* remote rows overwrite local ones that have no pending edit; local pending edits win and are uploaded.
   `full` = rows is the complete table, so a local row missing from it was deleted elsewhere. */
function mergeRemote(kind,rows,full=true){
 if(!rows.length&&!full)return 0;                     /* nothing changed anywhere: skip re-reading every local row */
 const k=KINDS[kind],sy=cloud.synced[kind],remote=new Map(rows.map(r=>[r.id,r]));
 const at=new Map(k.list.map((o,i)=>[o.id,i]));       /* id → position, so a big list is not searched once per row */
 /* a full pull needs to know every pending row (to keep local edits when deleting what is gone elsewhere); a small
    incremental pull only needs to ask about the rows that arrived */
 const dirtyAll=full?new Set(cloudDirtyList(kind).map(o=>o.id)):null;
 const pending={has:id=>{if(dirtyAll)return dirtyAll.has(id);const i=at.get(id);return i!==undefined&&isDirty(kind,k.list[i]);}};
 let changed=0;
 for(const [id,row] of remote){
  const obj=k.fromRow(row),s=sigOf(k.toRow(obj)),i=at.has(id)?at.get(id):-1;
  if(i<0){at.set(id,k.list.length);k.list.push(obj);sy[id]=s;changed=1;}
  else if(!pending.has(id)){
   if(sigOf(k.toRow(k.list[i]))!==s){k.list.splice(i,1,obj);changed=1;}
   sy[id]=s;
  }
 }
 for(let i=full?k.list.length-1:-1;i>=0;i--){
  const o=k.list[i];
  if(remote.has(o.id))continue;
  if(!pending.has(o.id)){k.list.splice(i,1);delete sy[o.id];changed=1;}   /* demo leftovers, or deleted on another desk */
  else delete sy[o.id];                                                    /* edited here but gone there: upload it again */
 }
 return changed;
}
/* Rows go up in batches of PUSH_BATCH (one request per row took minutes to catch up after a stretch offline). If the server
   refuses a batch for any reason, the rows are sent one at a time so a bad row, or an id already taken, is handled exactly
   as before. */
const PUSH_BATCH=100;
async function pushDirty(){
 for(const kind of ['att','vol']){
  const k=KINDS[kind],sy=cloud.synced[kind],list=cloudDirtyList(kind);
  const groups=[[list.filter(o=>sy[o.id]!==undefined),false],[list.filter(o=>sy[o.id]===undefined),true]];
  for(const [group,isFresh] of groups){
   for(let i=0;i<group.length;i+=PUSH_BATCH){
    const chunk=group.slice(i,i+PUSH_BATCH);
    if(chunk.length>1){
     const rows=chunk.map(o=>k.toRow(o)),sigs=rows.map(sigOf);
     const {error}=await (isFresh?cloud.client.from(k.table).insert(rows.map(inChurch)):cloud.client.from(k.table).upsert(rows.map(inChurch),{onConflict:conflictOn()}));
     if(!error){chunk.forEach((o,j)=>{sy[o.id]=sigs[j];});continue;}
    }
    for(const o of chunk)await pushOne(kind,o);
   }
  }
 }
}
async function pushOne(kind,o){
 const k=KINDS[kind],row=k.toRow(o),s=sigOf(row),fresh=cloud.synced[kind][o.id]===undefined;
 const q=fresh?cloud.client.from(k.table).insert(inChurch(row)):cloud.client.from(k.table).upsert(inChurch(row),{onConflict:conflictOn()});
 const {error}=await q;
 if(!error){cloud.synced[kind][o.id]=s;return;}
 if(fresh&&error.code==='23505')return resolveConflict(kind,o,s);
 if(/^2[23]/.test(error.code||'')){                         /* data the database refuses: skip this row, keep syncing the rest */
  cloud.rejected[o.id]=s;toast(`${o.id} was not uploaded: ${error.message}`);return;
 }
 throw error;
}
/* the id is already taken on the server */
async function resolveConflict(kind,o,s){
 const k=KINDS[kind];
 const {data,error}=await cloud.client.from(k.table).select('*').eq('id',o.id).maybeSingle();
 if(error)throw error;
 if(data&&sigOf(k.toRow(k.fromRow(data)))===s){cloud.synced[kind][o.id]=s;return;}   /* an earlier upload of this very row */
 if(kind==='att'){
  const i=k.list.indexOf(o);
  if(data&&i>=0){const r=k.fromRow(data);k.list.splice(i,1,r);cloud.synced.att[o.id]=sigOf(k.toRow(r));}
  toast(`${o.id} is already registered on another desk — showing that visitor`);
  return;
 }
 /* two desks pledged at the same moment: take the next free volunteer number */
 const ids=await cloud.client.from('volunteers').select('id');
 if(ids.error)throw ids.error;
 const max=Math.max(1000,...ids.data.map(r=>parseInt(String(r.id).replace(/\D/g,''),10)||0),...volunteers.map(v=>parseInt(String(v.id).replace(/\D/g,''),10)||0));
 const old=o.id;o.id='VOL-'+(max+1);
 if(state.volId===old)state.volId=o.id;
 return pushOne(kind,o);
}
function afterMerge(kind){
 if(!kind||kind==='att')if(!attendees.some(a=>a.id===state.activeId))state.activeId=(attendees[0]||{}).id||'';
 if(!kind||kind==='vol'){
  if(!state.volNew&&!volunteers.some(v=>v.id===state.volId))state.volId=(volunteers[0]||{}).id||null;
  if(cloud.user){let m=1000;for(const v of volunteers){const n=parseInt(String(v.id).replace(/\D/g,''),10)||0;if(n>m)m=n;}state._volSeq=m+1;}
 }
}
function cloudQueuePush(){
 if(!cloud.user||!cloud.client||cloud.blocked)return;
 clearTimeout(cloud.pushT);cloud.pushT=setTimeout(cloudPush,700);
}
async function cloudPush(){
 if(!cloud.user||!cloud.client||cloud.blocked)return;
 if(cloud.busy){cloud.again=true;return;}
 if(!cloudPending()){if(cloud.status==='syncing')setCloud('online');return;}
 cloud.busy=true;setCloud('syncing');
 try{await pushDirty();saveSynced();setCloud('online');healthUpload();}
 catch(err){cloudError(err,'upload');}
 finally{cloud.busy=false;if(cloud.again){cloud.again=false;cloudQueuePush();}}
}

/* ---------- live updates from other desks ---------- */
function startRealtime(){
 if(cloud.channel||!cloud.client)return;
 const ch=cloud.client.channel('newstart-live');
 for(const kind of ['att','vol'])ch.on('postgres_changes',{event:'*',schema:'public',table:KINDS[kind].table},p=>onRemoteChange(kind,p));
 ch.subscribe(st=>{cloud.liveSt=st;healthLive('live',st);});cloud.channel=ch;
}
function stopRealtime(){
 if(cloud.channel)noteHealth('live','off','Not connected.');
 cloud.liveSt='';
 if(cloud.channel&&cloud.client){try{cloud.client.removeChannel(cloud.channel);}catch(e){}}
 queueReset();
 cloud.channel=null;
}
function onRemoteChange(kind,p){
 const k=KINDS[kind],sy=cloud.synced[kind];
 /* With churches a badge number repeats across churches, and Supabase applies no row-level security to delete events
    (Realtime docs, "Postgres Changes"). So a live delete counts only when it names this device's church; one that does
    not is left to the next full pull, which notices deletions anyway. Inserts and updates are checked the same way. */
 if(cloud.churchId&&(p.eventType==='DELETE'?!(p.old&&p.old.church_id===cloud.churchId):!!(p.new&&p.new.church_id&&p.new.church_id!==cloud.churchId)))return;
 if(p.eventType==='DELETE'){
  const id=p.old&&p.old.id,i=k.list.findIndex(o=>o.id===id);
  if(i>=0&&sigOf(k.toRow(k.list[i]))===sy[id]){k.list.splice(i,1);delete sy[id];}
 }else if(p.new&&p.new.id){
  const obj=k.fromRow(p.new),s=sigOf(k.toRow(obj)),id=obj.id,i=k.list.findIndex(o=>o.id===id);
  if(i>=0){
   const here=sigOf(k.toRow(k.list[i]));
   if(here===s){sy[id]=s;return;}                 /* the echo of our own save */
   if(here!==sy[id])return;                      /* we have a pending edit of our own: it wins */
   k.list.splice(i,1,obj);
  }else k.list.push(obj);
  sy[id]=s;
 }else return;
 afterMerge(kind);saveSyncedSoon();persist();cloudRefresh();
}
/* redraw only when that cannot wipe something being typed */
function cloudRefresh(){
 clearTimeout(cloud.renderT);
 cloud.renderT=setTimeout(()=>{
  const el=document.activeElement;
  if((el&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName))||state.regOpen||state.volRegOpen||state.logOpen)return;
  render();
 },250);
}

/* ================= LIVE QUEUE =================
   Who is waiting at which station, shared between desks through the queue_entries table (see supabase/schema.sql).
   Unlike visitors and volunteers this is NOT offline-first: a line only means something if every desk sees the same
   line, so changes go straight to the database and are refused when there is no connection. Signed out, the tab runs
   as an in-memory practice queue on this device so staff can try it. */
const QUEUE_STATIONS=['vitals','bp','sugar','kitchen','plan','prayer'];
const QUEUE_SHORT={vitals:'Vitals & BMI',bp:'Blood Pressure',sugar:'Sugar & Chol.',kitchen:'Kitchen Pharmacy',plan:'Counselling',prayer:'Prayer'};
const QUEUE_DEFAULT_MIN={vitals:4,bp:5,sugar:6,kitchen:8,plan:10,prayer:10};   /* until 3 visits have really finished */
const QUEUE_WARN=10,QUEUE_ALERT=20;      /* minutes the longest-waiting person has stood in line: amber, then red */
const QUEUE_WINDOW_H=18;                 /* only today's queue is loaded */
const queue=[];                          /* {id,attendeeId,station,status,joinedAt,calledAt,finishedAt}; times in ms */
const qs={ready:false,err:'',ch:null,rt:'',subbed:false,skew:0,since:'',busy:false,syncing:false,seq:1,confirm:'',pick:'',pickQ:'',renderT:null};

const qSafe=s=>String(s==null?'':s).replace(/[^A-Za-z0-9-]/g,'');           /* ids end up inside onclick="" */
const qT=v=>v?(Date.parse(String(v).replace(/(\.\d{3})\d+/,'$1'))||0):0;
const qNow=()=>Date.now()+qs.skew;                                            /* the database's clock, not the phone's */
const qLive=()=>!!(cloud.user&&qs.ready);
const qMode=()=>cloud.user?(qs.ready?'live':(qs.err?'error':'loading')):(cloud.mode?'offline':'demo');
const qCan=()=>{const m=qMode();return m==='demo'||(m==='live'&&cloud.status!=='offline'&&navigator.onLine!==false);};
const qName=id=>{const a=attendees.find(x=>x.id===id);return a?a.name:id;};
const qMin=ms=>{const m=Math.floor(Math.max(0,ms)/60000);return m<1?'<1 min':m<60?m+' min':Math.floor(m/60)+' h '+(m%60)+' min';};
const rowToQ=r=>({id:qSafe(r.id),attendeeId:qSafe(r.attendee_id),station:qSafe(r.station),status:r.status,
  joinedAt:qT(r.joined_at),calledAt:qT(r.called_at),finishedAt:qT(r.finished_at)});
function qApply(r){
 if(!['waiting','serving','done','left'].includes(r.status))return;
 const e=rowToQ(r),i=queue.findIndex(x=>x.id===e.id);
 if(i>=0)queue[i]=e;else queue.push(e);
 if(r.updated_at&&r.updated_at>qs.since)qs.since=r.updated_at;
}
const qActive=(att,st)=>queue.find(e=>e.attendeeId===att&&(!st||e.station===st)&&(e.status==='waiting'||e.status==='serving'));
const qList=(st,status)=>queue.filter(e=>e.station===st&&e.status===status)
  .sort((a,b)=>(status==='waiting'?a.joinedAt-b.joinedAt:a.calledAt-b.calledAt)||(a.id<b.id?-1:1));
function qStats(st){
 const now=qNow(),wait=qList(st,'waiting'),serving=qList(st,'serving'),done=queue.filter(e=>e.station===st&&e.status==='done');
 const took=done.filter(e=>e.calledAt&&e.finishedAt>e.calledAt).sort((a,b)=>b.finishedAt-a.finishedAt).slice(0,15).map(e=>e.finishedAt-e.calledAt);
 const real=took.length>=3,avg=real?took.reduce((a,b)=>a+b,0)/took.length:(QUEUE_DEFAULT_MIN[st]||6)*60000;
 const longest=wait.length?Math.max(0,now-wait[0].joinedAt):0;
 /* people being served right now is the best guess for how many desks are open */
 const eta=wait.length?wait.length*avg/Math.max(1,serving.length):0;
 const mins=longest/60000;
 let tone=mins>=QUEUE_ALERT?'flag':mins>=QUEUE_WARN?'watch':'ok';
 if(wait.length&&!serving.length&&tone==='ok')tone='watch';                 /* people are waiting and nobody is serving */
 return {wait,serving,done:done.length,avg,real,samples:took.length,longest,eta,tone};
}

/* ---------- changes ---------- */
function qGate(){
 const m=qMode();
 if(m==='live'&&!qCan()){toast('No connection — the queue cannot change until you reconnect');return false;}
 if(qCan())return true;
 toast(m==='offline'?'No connection — the queue needs one so every desk sees the same line':m==='error'?'The live queue is not working yet — see the message on this screen':'Connecting to the live queue… try again in a moment');
 return false;
}
async function qRun(fn){if(qs.busy)return;qs.busy=true;try{await fn();}finally{qs.busy=false;}}
function qFail(err){
 console.warn('queue:',err);
 const msg=String((err&&err.message)||err||'');
 if(!navigator.onLine||/failed to fetch|networkerror|load failed|network request/i.test(msg))toast('No connection — nothing was changed');
 else if(err&&err.code==='42501')toast('This sign-in is not approved for the queue');
 else toast('Queue change failed: '+msg);
 queueSync();
}
async function queueJoin(att,st){
 if(!qGate())return false;
 if(qActive(att,st)){toast(`${qName(att)} is already in this line`);return false;}
 let ok=false;
 await qRun(async()=>{
  if(!qLive()){
   queue.push({id:'L'+(qs.seq++),attendeeId:qSafe(att),station:st,status:'waiting',joinedAt:Date.now(),calledAt:0,finishedAt:0});ok=true;
  }else{
   const {data,error}=await cloud.client.from('queue_entries').insert({attendee_id:att,station:st}).select().single();
   if(error){if(error.code==='23505'){toast(`${qName(att)} is already in this line`);queueSync();}else qFail(error);return;}
   qApply(data);ok=true;
  }
  const n=qList(st,'waiting').length;
  toast(`${firstName(qName(att))} added · ${n===1?'next up':n+' waiting'}`);
 });
 qAfter();return ok;
}
async function queueCallNext(st){
 if(!qGate())return;
 await qRun(async()=>{
  let e;
  if(!qLive()){
   e=qList(st,'waiting')[0];
   if(e){e.status='serving';e.calledAt=Date.now();e.finishedAt=0;}
  }else{
   const {data,error}=await cloud.client.rpc('queue_call_next',{p_station:st});
   if(error)return qFail(error);
   if(data&&data.length){qApply(data[0]);e=queue.find(x=>x.id===qSafe(data[0].id));}
  }
  if(!e){toast('Nobody is waiting here');return;}
  toast(`Next: ${qName(e.attendeeId)} · ${e.attendeeId}`);
 });
 qAfter();
}
async function qMove(id,to,from,msg){
 if(!qGate())return;
 await qRun(async()=>{
  const e=queue.find(x=>x.id===id);
  if(!e||!from.includes(e.status))return;
  if(!qLive()){
   const t=Date.now();e.status=to;
   if(to==='serving'){e.calledAt=t;e.finishedAt=0;}
   if(to==='waiting'){e.calledAt=0;e.finishedAt=0;}
   if(to==='done'||to==='left')e.finishedAt=t;
  }else{
   const {data,error}=await cloud.client.from('queue_entries').update({status:to}).eq('id',id).in('status',from).select();
   if(error)return qFail(error);
   if(!data.length){toast('Someone else just changed that one');queueSync();return;}
   qApply(data[0]);
  }
  if(msg)toast(msg(e));
 });
 qAfter();
}
const queueServe=id=>qMove(id,'serving',['waiting'],e=>`Next: ${qName(e.attendeeId)} · ${e.attendeeId}`);
const queueDone=id=>qMove(id,'done',['serving'],e=>`${firstName(qName(e.attendeeId))} finished ✓`);
const queueBack=id=>qMove(id,'waiting',['serving'],e=>`${firstName(qName(e.attendeeId))} is back in line (same place)`);
function queueRemove(id){
 if(qs.confirm!==id){qs.confirm=id;clearTimeout(qs.confT);qs.confT=setTimeout(()=>{qs.confirm='';if(state.tab==='queue')renderMain();},3000);renderMain();return;}
 qs.confirm='';
 qMove(id,'left',['waiting','serving'],e=>`${firstName(qName(e.attendeeId))} removed from the line`);
}
function qSelect(k){state.qStation=k;qs.confirm='';renderMain();}

/* ---------- loading and live updates ---------- */
async function queueSync(manual){
 if(!cloud.client||!cloud.user||qs.syncing)return;
 qs.syncing=true;
 try{
  const clock=await cloud.client.rpc('queue_now');
  if(clock.error)throw clock.error;
  qs.skew=qT(clock.data)-Date.now();
  const first=!qs.ready||!!manual,col=first?'joined_at':'updated_at';
  const from=first?new Date(qNow()-QUEUE_WINDOW_H*36e5).toISOString():(qs.since||new Date(qNow()-QUEUE_WINDOW_H*36e5).toISOString());
  const rows=[];
  for(let p=0;p<100;p++){
   const {data,error}=await cloud.client.from('queue_entries').select('*').gte(col,from).order(col).order('id').range(p*500,p*500+499);
   if(error)throw error;
   rows.push(...data);if(data.length<500)break;
  }
  if(first){queue.length=0;qs.since='';}
  rows.forEach(qApply);
  if(!qs.since)qs.since=from;
  qs.ready=true;qs.err='';
  startQueueRealtime();healthLive('queue',qs.rt);
 }catch(err){
  console.warn('queue sync:',err);
  const msg=String((err&&err.message)||err||'');
  if(err&&(err.code==='PGRST205'||err.code==='PGRST202'||err.code==='42P01'||err.code==='42883'||/schema cache|could not find the (table|function)/i.test(msg)))
   {qs.ready=false;qs.err='The live queue is not set up yet. Run supabase/schema.sql again in the Supabase SQL editor.';}
  else if(!navigator.onLine||/failed to fetch|networkerror|load failed|network request/i.test(msg)){if(!qs.ready)qs.err='Could not reach the server yet — retrying.';}
  else if(err&&(err.code==='42501'||/row-level security|permission denied/i.test(msg)))
   {qs.ready=false;qs.err='This sign-in is not approved for the queue.';}
  else if(!qs.ready)qs.err=msg||'The queue could not load.';
  healthFromError('queue',err,isMissingErr(err)?(missingName(err)||'queue_entries'):'');
 }finally{qs.syncing=false;qAfter();}
}
function startQueueRealtime(){
 if(qs.ch||!cloud.client)return;
 const ch=cloud.client.channel('newstart-queue');
 ch.on('postgres_changes',{event:'*',schema:'public',table:'queue_entries'},p=>{
  if(p.eventType==='DELETE'){const id=qSafe(p.old&&p.old.id),i=queue.findIndex(e=>e.id===id);if(i>=0)queue.splice(i,1);}
  else if(p.new&&p.new.id)qApply(p.new);
  else return;
  qRefresh();
 });
 ch.subscribe(st=>{
  qs.rt=st;healthLive('queue',st);
  if(st==='SUBSCRIBED'){if(qs.subbed)queueSync();qs.subbed=true;}    /* reconnected: fetch whatever was missed */
  qRefresh();
 });
 qs.ch=ch;
}
function queueReset(){
 if(qs.ch&&cloud.client){try{cloud.client.removeChannel(qs.ch);}catch(e){}}
 qs.ch=null;qs.rt='';qs.subbed=false;qs.ready=false;qs.err='';qs.since='';qs.skew=0;qs.confirm='';
 queue.length=0;
}
function qRefresh(){clearTimeout(qs.renderT);qs.renderT=setTimeout(qAfter,150);}
function qAfter(){renderNav();if(state.tab==='queue')renderMain();if(tvOpen())renderBigScreen();}

/* ---------- adding a visitor to a line ---------- */
function openQueuePick(st){
 if(!qGate())return;
 qs.pick=st;qs.pickQ='';
 $('#queueHead').innerHTML=`<h3 class="display text-base font-extrabold">Add to ${esc((BOOTH(st)||{}).label||st)}</h3>
  <input id="qq" type="search" placeholder="Search by name, badge or phone" oninput="qFilterPick(this.value)" class="field mt-2.5" autocomplete="off">`;
 qRenderPick();showModal('#queueModal');
}
function closeQueuePick(){hideModal('#queueModal');qs.pick='';}
function qFilterPick(v){qs.pickQ=v;qRenderPick();}
function qRenderPick(){
 const rows=visitorsToShow(qs.pickQ),el=$('#queueList');
 if(!rows.length){el.innerHTML=`<p class="q-empty">${String(qs.pickQ||'').trim()?'Nobody matches that.':'No visitors yet — register the first one.'}</p>`;return;}
 el.innerHTML=rows.map(a=>{
  const here=qActive(a.id,qs.pick);
  const elsewhere=queue.filter(e=>e.attendeeId===a.id&&e.station!==qs.pick&&(e.status==='waiting'||e.status==='serving'))
   .map(e=>`<span class="chip chip-none">${esc(QUEUE_SHORT[e.station]||e.station)}${e.status==='serving'?' · now':''}</span>`).join(' ');
  return `<button class="q-pick" ${here?'disabled':`onclick="qPickAdd('${a.id}')"`}>
   <span class="flex h-9 w-9 flex-none items-center justify-center rounded-[13px] text-[11px] font-extrabold tint hue-${hueOf(a.id)}">${esc(initials(a.name))}</span>
   <span class="q-who"><b>${esc(a.name)}</b><span class="mono">${esc(a.id)}</span>${elsewhere?`<span style="margin-top:2px">${elsewhere}</span>`:''}</span>
   <span class="${here?'chip chip-ok':'q-mini q-mini-soft'}">${here?(here.status==='serving'?'Being served':'In line ✓'):'Add'}</span>
  </button>`}).join('');
}
async function qPickAdd(id){if(qs.pick)await queueJoin(id,qs.pick);qRenderPick();}

/* ---------- screen ---------- */
/* [kind, text for staff, short text for the big screen] */
function qStateInfo(mode){
 if(mode==='live'){
  if(cloud.status==='offline'||navigator.onLine===false)return ['warn','Offline — the line is paused here until you reconnect. What you see may be out of date.','Offline — numbers may be out of date'];
  return qs.rt==='SUBSCRIBED'?['live','Live — every desk sees this same line','Live']:['warn','Reconnecting… numbers may be a few seconds behind','Reconnecting…'];
 }
 if(mode==='loading')return ['info','Connecting to the live queue…','Connecting…'];
 if(mode==='error')return ['bad',esc(qs.err),'Queue not available'];
 if(mode==='offline')return ['warn','No connection. The queue needs one so every desk sees the same line.','No connection — numbers may be out of date'];
 return ['info','Practice mode — sign in to share this queue between desks. Nothing here is saved.','Practice mode'];
}
function qStateBar(mode){
 const [k,txt]=qStateInfo(mode);
 const extra=(mode==='error'?`<button class="q-mini q-mini-soft" onclick="queueSync(true)">Retry</button>`:'')+(k==='warn'||k==='bad'?`<button class="q-mini q-mini-soft" onclick="openCloud()">Details</button>`:'');
 return `<div class="q-state q-state-${k} mt-2.5"><span class="q-dot"></span><span style="flex:1">${txt}</span>${extra}</div>`;
}

/* ---------- big screen ---------- */
const tvOpen=()=>!$('#tv').classList.contains('hidden');
function renderBigScreen(){
 const [k,,short]=qStateInfo(qMode());
 const st=$('#tvState');st.className='q-tv-sub '+k;st.innerHTML=`<i></i>${esc(short)}`;
 $('#tvClock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
 $('#tvGrid').innerHTML=QUEUE_STATIONS.map(key=>{
  const s=qStats(key),now=s.serving.slice(0,2),more=s.serving.length-now.length,nxt=s.wait.slice(0,4),rest=s.wait.length-nxt.length;
  return `<div class="q-tv-tile q-tv-${s.tone}">
   <div class="q-tv-name">${esc(QUEUE_SHORT[key])}</div>
   <div class="q-tv-lab">Now serving</div>
   ${now.length?`<div class="q-tv-now">${now.map(e=>esc(e.attendeeId.replace(/^EXPO-/,''))).join(' · ')}${more>0?`<small>+${more}</small>`:''}</div>`:'<div class="q-tv-none">—</div>'}
   <div class="q-tv-lab">Next</div>
   ${nxt.length?`<div class="q-tv-next">${nxt.map(e=>`<span>${esc(e.attendeeId.replace(/^EXPO-/,''))}</span>`).join('')}${rest>0?`<span>+${rest}</span>`:''}</div>`:'<div class="q-tv-none">Nobody waiting</div>'}
   <div class="q-tv-meta">${s.wait.length?`${s.wait.length} waiting · about ${Math.max(1,Math.round(s.eta/60000))} min`:'No wait — walk right in'}</div>
  </div>`;}).join('');
}
function openBigScreen(){
 const tv=$('#tv');tv.classList.remove('hidden');renderBigScreen();
 try{const p=tv.requestFullscreen&&tv.requestFullscreen();if(p&&p.catch)p.catch(()=>{});}catch(e){}
 qWake();
}
function closeBigScreen(){
 $('#tv').classList.add('hidden');
 try{if(document.fullscreenElement){const p=document.exitFullscreen();if(p&&p.catch)p.catch(()=>{});}}catch(e){}
 if(qs.wake){try{qs.wake.release();}catch(e){}qs.wake=null;}
}
/* keep a TV from going to sleep */
async function qWake(){try{if(navigator.wakeLock&&tvOpen()&&!qs.wake){qs.wake=await navigator.wakeLock.request('screen');qs.wake.addEventListener('release',()=>{qs.wake=null;});}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&tvOpen())qWake();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&tvOpen())closeBigScreen();});
function qCard(k,st,sel){
 const first=st.serving[0],more=st.serving.length-1;
 const serve=first?`Serving <b>${esc(first.attendeeId)}</b>${more>0?` +${more}`:''}`:(st.wait.length?'<b>Nobody serving</b>':'Free — nobody here');
 const eta=st.wait.length?`About <b>${Math.max(1,Math.round(st.eta/60000))} min</b> · longest ${qMin(st.longest)}`:'No wait';
 return `<button onclick="qSelect('${k}')" class="q-card q-card-${st.tone} ${sel?'q-card-sel':''}" aria-pressed="${sel}">
  <span class="q-card-top"><span class="q-card-name">${esc(QUEUE_SHORT[k])}</span><span class="q-card-dot"></span></span>
  <span class="q-card-n">${st.wait.length}<small>waiting</small></span>
  <span class="q-card-line">${serve}</span><span class="q-card-line">${eta}</span></button>`;
}
function qRow(e,i,st){
 const now=qNow(),name=qName(e.attendeeId),av=`<span class="flex h-9 w-9 flex-none items-center justify-center rounded-[13px] text-[11px] font-extrabold tint hue-${hueOf(e.attendeeId)}">${esc(initials(name))}</span>`;
 const sure=qs.confirm===e.id,x=`<button class="q-mini q-mini-x ${sure?'q-sure':''}" onclick="queueRemove('${e.id}')" aria-label="Remove ${esc(name)} from the line">${sure?'Remove?':'✕'}</button>`;
 if(e.status==='serving')
  return `<div class="q-row q-row-serving">${av}<div class="q-who"><b>${esc(name)}</b><span class="mono">${esc(e.attendeeId)} · with you for ${qMin(now-e.calledAt)}</span></div>
   <div class="q-btns"><button class="q-mini q-mini-go" onclick="queueDone('${e.id}')">Done ✓</button>
   <button class="q-mini q-mini-soft" onclick="queueBack('${e.id}')" aria-label="Put ${esc(name)} back in line" title="Put back in line">↩</button>${x}</div></div>`;
 const w=now-e.joinedAt,cls=w/60000>=QUEUE_ALERT?'q-late':w/60000>=QUEUE_WARN?'q-slow':'';
 return `<div class="q-row"><span class="q-pos">${i+1}</span><div class="q-who"><b>${esc(name)}</b>
   <span class="mono ${cls}">${esc(e.attendeeId)} · waiting ${qMin(w)}</span></div>
   <div class="q-btns"><button class="q-mini q-mini-soft" onclick="queueServe('${e.id}')">Call</button>${x}</div></div>`;
}
function qDetail(k,st,can){
 const dis=can?'':' disabled',m=Math.max(1,Math.round(st.avg/60000));
 const note=st.real?`Average ${m} min per person (last ${st.samples} finished). ${st.done} finished today.`
  :`Estimating ${m} min per person until a few visits have finished here. ${st.done} finished today.`;
 return `<div class="glass p-4">
  <div class="q-head"><div><div class="microlabel">Station</div><div class="display text-base font-extrabold">${esc((BOOTH(k)||{}).label||k)}</div></div></div>
  <div class="q-actions">
   <button class="btn btn-primary" onclick="queueCallNext('${k}')"${can&&st.wait.length?'':' disabled'}>Call next →</button>
   <button class="btn btn-soft" onclick="openQueuePick('${k}')"${dis}>+ Add visitor</button>
  </div>
  <div class="q-label">Being served · ${st.serving.length}</div>
  ${st.serving.length?st.serving.map((e,i)=>qRow(e,i,st)).join(''):'<div class="q-empty">Nobody being served right now.</div>'}
  <div class="q-label">Waiting · ${st.wait.length}</div>
  ${st.wait.length?st.wait.map((e,i)=>qRow(e,i,st)).join(''):'<div class="q-empty">Nobody waiting — nice and quiet ✓</div>'}
  <p class="q-note">${note}</p>
 </div>`;
}
function viewQueue(){
 const mode=qMode(),can=qCan();
 const sel=QUEUE_STATIONS.includes(state.qStation)?state.qStation:QUEUE_STATIONS[0];
 const S={};QUEUE_STATIONS.forEach(k=>S[k]=qStats(k));
 const tot=QUEUE_STATIONS.reduce((t,k)=>({w:t.w+S[k].wait.length,s:t.s+S[k].serving.length,d:t.d+S[k].done,l:Math.max(t.l,S[k].longest)}),{w:0,s:0,d:0,l:0});
 const tile=(n,l)=>`<div class="q-total"><b>${n}</b><span>${l}</span></div>`;
 return `<section class="space-y-3.5">
  <div class="glass p-4">
   <div class="q-head"><div><div class="microlabel">Live queue</div>
    <div class="display text-base font-extrabold">Who is waiting where</div></div>
    <button class="btn btn-soft q-tvbtn" onclick="openBigScreen()">Big screen</button></div>
   ${qStateBar(mode)}
   <div class="q-totals">${tile(tot.w,'Waiting')}${tile(tot.s,'Being served')}${tile(tot.d,'Finished')}${tile(tot.w?qMin(tot.l).replace(' min','m'):'—','Longest wait')}</div>
  </div>
  <div class="q-board">${QUEUE_STATIONS.map(k=>qCard(k,S[k],k===sel)).join('')}</div>
  ${qDetail(sel,S[sel],can)}
 </section>`;
}
setInterval(()=>{if((state.tab==='queue'||tvOpen())&&!document.hidden)qAfter();},20000);   /* the "waiting 7 min" figures tick up */

/* Init — seed the volunteer roster before loading, so older saved payloads
   (which have no volunteers key) still keep a usable roster. */
JSON.parse(JSON.stringify(SEED_VOL)).forEach(v=>volunteers.push(v));
if(!loadPersisted())seedDemo();
loadSynced();
cloud.ready=cloud.mode;          /* a device that has been signed in before opens straight into its saved copy */
renderGate();
render();
addEventListener('pagehide',()=>{if(cloud.user)saveSynced();});
addEventListener('online',()=>{if(!cloud.client)cloudInit();else if(cloud.user)cloudSync();});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cloud.user)cloudSync();});
setInterval(()=>{if(cloud.user&&!document.hidden)cloudSync();},60000);
if(!window.NEWSTART_NO_CLOUD)cloudInit();
</script>
