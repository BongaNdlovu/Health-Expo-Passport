  /* iOS Safari zooms the whole page when a field smaller than 16px is tapped; on touch screens keep them at 16px */
  @media (pointer:coarse){.field,.step-input,select.field,textarea.field{font-size:16px}}
  /* a downward swipe at the top must not reload the page and throw away a half-filled form */
  html,body{overscroll-behavior-y:contain}
  /* no 300ms tap delay / double-tap zoom on controls */
  button,a,input,select,textarea,label{touch-action:manipulation}
  @media (display-mode:standalone){body{-webkit-user-select:none;user-select:none}input,textarea,.mono,[contenteditable]{-webkit-user-select:text;user-select:text}}

  /* ============ LIVE QUEUE ============ */
  .q-state{display:flex;align-items:center;gap:.5rem;border-radius:16px;padding:.55rem .75rem;font-size:11px;font-weight:700;line-height:1.35}
  .q-state-live{background:rgba(58,165,151,.11);color:#1f6b62}
  .q-state-warn{background:rgba(231,184,79,.17);color:#7a5012}
  .q-state-bad{background:rgba(217,105,92,.12);color:#a4483f}
  .q-state-info{background:rgba(18,48,51,.06);color:#436063}
  .q-dot{width:9px;height:9px;flex:none;border-radius:50%;background:currentColor}
  /* the ring was an animated box-shadow, which repaints forever while the queue is live;
     the same ring as a scaled, fading pseudo-element stays on the compositor */
  .q-state-live .q-dot{position:relative}
  .q-state-live .q-dot::after{content:"";position:absolute;inset:0;border-radius:50%;pointer-events:none;
    border:2px solid rgba(47,158,111,.5);animation:qpulse 1.8s ease-in-out infinite}
  @keyframes qpulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(2.2);opacity:0}}
  html.lite .q-state-live .q-dot::after{animation:none;opacity:0}
  @media (prefers-reduced-motion:reduce){.q-state-live .q-dot::after{animation:none;opacity:0}}
  .q-totals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.4rem;margin-top:.7rem}
  .q-total{border-radius:16px;background:rgba(18,48,51,.045);padding:.55rem .25rem;text-align:center}
  .q-total b{display:block;font-family:'Plus Jakarta Sans',Inter,sans-serif;font-size:1.25rem;line-height:1;font-weight:800;color:#0f2a2c}
  .q-total span{display:block;margin-top:.3rem;font-size:9.5px;font-weight:700;color:#5c747a}
  .q-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem}
  .q-card{position:relative;text-align:left;border-radius:20px;padding:.8rem .8rem .75rem;border:1.5px solid transparent;
          background:linear-gradient(160deg,rgba(255,255,255,.86),rgba(255,255,255,.55));box-shadow:0 10px 24px -18px rgba(16,60,58,.5);
          transition:transform .2s,border-color .2s,box-shadow .2s}
  .q-card{display:block;width:100%;cursor:pointer}
  .q-card-n,.q-card-line{display:block}
  .q-card:active{transform:scale(.975)}
  .q-card-sel{border-color:var(--qc,#46a597);box-shadow:0 14px 28px -16px var(--qc,#46a597)}
  .q-card-ok{--qc:#2f9e6f}.q-card-watch{--qc:#d9a23c}.q-card-flag{--qc:#d6584a}
  .q-card-top{display:flex;align-items:center;justify-content:space-between;gap:.4rem}
  .q-card-name{font-size:11px;font-weight:800;color:#33504f;line-height:1.2}
  .q-card-dot{width:10px;height:10px;flex:none;border-radius:50%;background:var(--qc)}
  .q-card-n{margin-top:.5rem;font-family:'Plus Jakarta Sans',Inter,sans-serif;font-size:2rem;line-height:1;font-weight:800;color:#0f2a2c}
  .q-card-n small{margin-left:.3rem;font-family:Inter,system-ui,sans-serif;font-size:10px;font-weight:700;color:#4f6870}
  .q-card-line{margin-top:.35rem;font-size:10px;font-weight:600;color:#5c747a;line-height:1.35}
  .q-card-line b{color:#123033}
  .q-head{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem}
  .q-actions{display:grid;grid-template-columns:1.4fr 1fr;gap:.5rem;margin-top:.8rem}
  .q-actions .btn{padding:.8rem .5rem;font-size:12px}
  .q-actions .btn[disabled],.q-mini[disabled]{opacity:.45;pointer-events:none}
  .q-label{margin:1rem .15rem .45rem;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#5c747a}
  .q-row{display:flex;align-items:center;gap:.6rem;border-radius:18px;padding:.55rem .6rem;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9)}
  .q-row+.q-row{margin-top:.4rem}
  .q-row-serving{background:linear-gradient(160deg,rgba(220,243,238,.9),rgba(255,255,255,.7));border-color:rgba(58,165,151,.28)}
  .q-pos{display:flex;width:28px;height:28px;flex:none;align-items:center;justify-content:center;border-radius:10px;font-size:12px;font-weight:800;background:rgba(18,48,51,.07);color:#33504f}
  .q-who{min-width:0;flex:1}
  .q-who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:700;color:#123033}
  .q-who span{display:block;font-size:10px;font-weight:600;color:#4f6870}
  .q-late{color:#b04a42!important;font-weight:800!important}
  .q-slow{color:#8f5f14!important;font-weight:800!important}
  .q-btns{display:flex;flex:none;gap:.3rem}
  .q-mini{min-width:36px;height:36px;border-radius:12px;padding:0 .6rem;font-size:11px;font-weight:800;border:0;cursor:pointer;
          display:inline-flex;align-items:center;justify-content:center;transition:transform .15s,background .2s}
  .q-mini:active{transform:scale(.93)}
  .q-mini-go{background:linear-gradient(135deg,#46a597,#2b8074);color:#fff}
  .q-mini-soft{background:rgba(58,165,151,.12);color:#1f6b62}
  .q-mini-x{background:rgba(18,48,51,.06);color:#4f6870}
  .q-mini-x.q-sure{background:#d6584a;color:#fff}
  .q-empty{padding:.9rem .5rem;text-align:center;font-size:11px;font-weight:600;color:#4f6870}
  .q-pick{display:flex;width:100%;align-items:center;gap:.7rem;border-radius:18px;padding:.55rem .6rem;text-align:left}
  .q-pick:hover{background:rgba(255,255,255,.6)}
  .q-pick[disabled]{opacity:.6;cursor:default}
  .q-note{margin-top:.7rem;font-size:10.5px;line-height:1.45;color:#4f6870}
  .q-tvbtn{flex:none;padding:.5rem .8rem;font-size:11px;border-radius:14px}

  /* ============ BIG SCREEN (TV / projector) — sizes follow the screen, not the phone ============ */
  .q-tv{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;gap:2vmin;padding:2.4vmin 2.8vmin;overflow:hidden;color:#eaf6f3;
        background:radial-gradient(120% 90% at 15% 0%,#175052 0%,#0d2426 55%,#08171a 100%)}
  .q-tv.hidden{display:none}
  .q-tv-top{display:flex;align-items:center;justify-content:space-between;gap:2vmin}
  .q-tv-title{font-family:'Plus Jakarta Sans',Inter,sans-serif;font-weight:800;font-size:clamp(18px,3.6vmin,48px);letter-spacing:-.01em}
  .q-tv-sub{margin-top:.4vmin;font-size:clamp(11px,1.9vmin,24px);font-weight:700;display:flex;align-items:center;gap:.8vmin}
  .q-tv-sub i{display:inline-block;width:1.5vmin;height:1.5vmin;min-width:8px;min-height:8px;border-radius:50%;background:currentColor}
  .q-tv-sub.live{color:#6fdca8}.q-tv-sub.warn{color:#f3c15a}.q-tv-sub.bad{color:#f58b80}.q-tv-sub.info{color:#a9c4c4}
  .q-tv-right{display:flex;align-items:center;gap:2vmin}
  .q-tv-clock{font-family:'Plus Jakarta Sans',Inter,sans-serif;font-weight:800;font-size:clamp(18px,3.6vmin,48px);font-variant-numeric:tabular-nums}
  .q-tv-x{width:max(36px,4.4vmin);height:max(36px,4.4vmin);border-radius:50%;border:0;cursor:pointer;background:rgba(255,255,255,.12);color:#eaf6f3;font-size:clamp(14px,2vmin,26px);font-weight:800;opacity:.55}
  .q-tv-x:hover{opacity:1}
  .q-tv-grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));gap:1.8vmin}
  @media (orientation:portrait){.q-tv-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr))}}
  .q-tv-tile{display:flex;flex-direction:column;min-height:0;overflow:hidden;border-radius:2.4vmin;padding:2vmin 2.2vmin;
             background:rgba(255,255,255,.065);border:.35vmin solid var(--qc,#4cc38a)}
  .q-tv-ok{--qc:#4cc38a}.q-tv-watch{--qc:#f0b84a}.q-tv-flag{--qc:#f0766a}
  .q-tv-name{font-family:'Plus Jakarta Sans',Inter,sans-serif;font-weight:800;font-size:clamp(14px,2.7vmin,36px);line-height:1.15}
  .q-tv-lab{margin-top:1.6vmin;font-size:clamp(9px,1.45vmin,19px);font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--qc)}
  .q-tv-now{font-family:'Plus Jakarta Sans',Inter,sans-serif;font-weight:800;font-size:clamp(22px,6.4vmin,86px);line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .q-tv-now small{font-size:.5em;opacity:.7;margin-left:.4em}
  .q-tv-none{font-size:clamp(14px,2.6vmin,34px);font-weight:700;opacity:.55}
  .q-tv-next{font-size:clamp(13px,2.9vmin,38px);font-weight:700;line-height:1.3;font-variant-numeric:tabular-nums;opacity:.92}
  .q-tv-next span+span{margin-left:1.2vmin}
  .q-tv-meta{margin-top:auto;padding-top:1.2vmin;font-size:clamp(11px,2vmin,26px);font-weight:700;opacity:.8}

  /* ============ CHECK step: reading warnings ============ */
  .st-warn{margin-top:.4rem;font-size:11.5px;font-weight:700;line-height:1.4;color:#a4483f}
  .st-fix{display:inline-flex;align-items:center;min-height:34px;margin-left:.25rem;border:0;border-radius:9999px;padding:.3rem .8rem;
          background:#d6584a;color:#fff;font-size:11.5px;font-weight:800;cursor:pointer}
  .st-height{display:flex;align-items:center;gap:.4rem;font-size:11.5px;font-weight:700;color:#3d5c5e}
  .st-height input{width:4.2rem;min-height:40px;border-radius:12px;border:1px solid rgba(18,48,51,.12);background:rgba(255,255,255,.8);padding:0 .5rem;text-align:center;font:inherit;font-size:14px}
  .st-height input.is-bad{border-color:#d6584a;background:#fdf0ee}
  .step-input.is-bad{border-color:#d6584a!important;background:#fdf0ee!important;color:#a4483f}

  .vw-bar{display:flex;width:100%;align-items:center;justify-content:space-between;gap:.5rem;min-height:44px;margin-bottom:.55rem;
          border:1px solid rgba(216,148,85,.3);border-radius:16px;padding:.4rem .5rem .4rem .8rem;background:rgba(252,238,221,.7);
          font-size:12px;color:#5b4a36;text-align:left;cursor:pointer}
  .vw-bar b{color:#0f2a2c}
  .vw-sw{flex:none;border-radius:9999px;padding:.35rem .75rem;background:#fff;font-size:11.5px;font-weight:800;color:#8f5420}

  /* ============ VISITOR JOURNEY frame ============ */
  .jr{margin-bottom:.9rem;border-radius:22px;padding:.7rem;background:var(--hx-surface);
      border:1px solid var(--hx-line);box-shadow:0 12px 28px -22px rgba(0,0,0,.35)}
  .jr-who{display:flex;width:100%;align-items:center;gap:.65rem;border:0;background:none;padding:.15rem .2rem .55rem;text-align:left;cursor:pointer}
  .jr-av{display:flex;flex:none;width:36px;height:36px;align-items:center;justify-content:center;border-radius:13px;font-size:12px;font-weight:800}
  .jr-name{min-width:0;flex:1}
  .jr-name b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:800;color:var(--hx-ink)}
  .jr-name>span{display:block;font-size:10.5px;font-weight:600;color:var(--hx-ink-2)}
  .jr-name em{font-style:normal;font-weight:800;color:var(--hx-rose)}
  .jr-change{flex:none;border-radius:9999px;padding:.3rem .7rem;font-size:10.5px;font-weight:800;color:var(--hx-mint-deep);background:var(--hx-mint-soft)}
  .jr-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;list-style:none;margin:0;padding:0}
  .jr-step{display:flex;width:100%;flex-direction:column;align-items:center;gap:3px;border:0;border-radius:14px;padding:.45rem .1rem;
           background:var(--hx-surface-2);cursor:pointer;color:var(--hx-ink-2);transition:background .2s,color .2s}
  .jr-dot{display:flex;width:22px;height:22px;align-items:center;justify-content:center;border-radius:50%;font-size:11px;font-weight:800;
          background:rgba(18,48,51,.08);color:#5c747a}
  .jr-lbl{font-size:10.5px;font-weight:800;line-height:1.1;text-align:center}
  .jr-lbl small{display:block;font-size:9px;font-weight:700;opacity:.8}
  .jr-step.is-past .jr-dot{background:var(--hx-mint-soft);color:var(--hx-mint-deep)}
  .jr-step.is-on{background:linear-gradient(135deg,var(--hx-mint-cta-a),var(--hx-mint-cta-b));color:var(--hx-on-mint);box-shadow:0 10px 20px -12px rgba(21,128,61,.5)}
  .jr-step.is-on .jr-dot{background:rgba(0,0,0,.12);color:inherit}
  /* Back / Next stay in reach above the tab bar, however long the step is */
  .jr-foot{position:sticky;bottom:calc(var(--navh,84px) + 4px);z-index:20;margin-top:1rem;border-radius:22px;padding:.55rem;
           background:var(--hx-dock);border:1px solid var(--hx-dock-line);box-shadow:var(--hx-dock-shadow)}
  .lite .jr-foot{backdrop-filter:none;-webkit-backdrop-filter:none}
  .st-one .step-input{min-height:58px;font-size:24px}
  .st-one .step-btn{width:58px;height:58px;font-size:24px}
  .sw-on{background:var(--hx-surface);color:var(--hx-mint-deep);box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .tap-link{display:inline-flex;align-items:center;min-height:44px;padding:0 .2rem;border:0;background:none;cursor:pointer;
            font-size:12px;font-weight:800;color:var(--hx-mint-deep);white-space:nowrap}
  .pf .btn[disabled]{opacity:.45;pointer-events:none}
  .jr-note{margin:.1rem .25rem .5rem;font-size:11px;font-weight:600;color:var(--hx-ink-2);text-align:center}
  .jr-btns{display:grid;grid-template-columns:1fr 1.6fr;gap:.5rem}
  .jr-btns .btn{padding:.85rem .5rem;font-size:12.5px}
  .snd-list{display:grid;gap:.55rem}
  .snd-item{display:flex;width:100%;align-items:center;gap:.8rem;border-radius:20px;padding:.9rem 1rem;text-align:left;cursor:pointer;
            border:1px solid #fff;background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.62));box-shadow:0 12px 26px -22px rgba(16,60,58,.5)}
  .snd-item b{display:block;font-size:13px;color:var(--hx-ink)}
  .snd-item span span{display:block;margin-top:2px;font-size:11px;color:var(--hx-ink-2)}
  .snd-ic{flex:none;font-size:22px;line-height:1}
  .snd-go{flex:none;font-size:15px;font-weight:800;color:var(--hx-mint-deep)}
  html[data-theme] .snd-item.is-on{border-color:var(--hx-mint-line);background:var(--hx-mint-soft)}

  /* ============ PLAN: what to do, why and how ============ */
  .pl-problem{margin-top:.55rem;font-size:13.5px;font-weight:700;line-height:1.4;color:var(--hx-ink-2)}
  .pl-also{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:.7rem;font-size:10.5px;font-weight:700;color:var(--hx-ink-2)}
  .pl-also .fd-chip{padding:.4rem .7rem}
  .pl-switch{margin-top:.75rem}
  .pl-switch summary,.pl-det summary{cursor:pointer;list-style:none}
  .pl-switch summary::-webkit-details-marker,.pl-det summary::-webkit-details-marker{display:none}
  .pl-switch summary{display:inline-block;font-size:11px;font-weight:800;color:var(--hx-mint-deep)}
  .pl-urgent{display:grid;gap:.25rem;border-radius:20px;padding:.85rem 1rem;font-size:11.5px;line-height:1.45;
             background:rgba(217,105,92,.12);border:1px solid rgba(217,105,92,.3);color:#a4483f}
  .pl-urgent b{font-size:13px}
  .pl-h{margin:0 .25rem .55rem;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--hx-ink-2)}
  .ac-list{list-style:none;margin:0;padding:0;display:grid;gap:.65rem}
  .ac-card{border-radius:22px;padding:1rem 1rem .95rem;border:1px solid #fff;
           background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(255,255,255,.64));box-shadow:0 14px 30px -22px rgba(16,60,58,.55)}
  .ac-top{display:flex;align-items:flex-start;gap:.7rem}
  .ac-n{display:flex;flex:none;width:30px;height:30px;align-items:center;justify-content:center;border-radius:50%;
        font-size:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--s1),var(--s2))}
  .ac-do{padding-top:3px;font-family:'Plus Jakarta Sans',Inter,sans-serif;font-size:15.5px;font-weight:800;line-height:1.3;color:var(--hx-ink)}
  .ac-why,.ac-how{margin-top:.6rem;font-size:12.5px;line-height:1.5;color:var(--hx-ink-2)}
  .ac-why b,.ac-how b{display:inline-block;margin-right:.4rem;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--hx-ink)}
  .ac-how ul{margin:.2rem 0 0;padding-left:1.15rem;list-style:disc}
  .ac-how li+li{margin-top:.15rem}
  .ac-ref{font-size:9.5px;font-weight:700;color:var(--hx-ink-2);white-space:nowrap}
  .ac-cost{display:inline-block;margin-top:.65rem;border-radius:9999px;padding:2px 10px;font-size:10.5px;font-weight:800;
           background:var(--hx-warn-bg);color:var(--hx-warn)}
  .pl-more{list-style:none;margin:.55rem 0 0;padding:0;display:grid;gap:.6rem}
  .pl-more li{font-size:12.5px;line-height:1.4;color:var(--hx-ink)}
  .pl-more li>span:last-child{display:block;margin-top:2px;font-size:11.5px;color:var(--hx-ink-2)}
  .pl-row{display:flex;align-items:flex-start;gap:.65rem}
  .pl-row+.pl-row{margin-top:.75rem}
  .pl-ic{flex:none;font-size:18px;line-height:1.25}
  .pl-row b{display:block;font-size:12.5px;color:var(--hx-ink)}
  .pl-row>div>span{display:block;margin-top:2px;font-size:11.5px;line-height:1.45;color:var(--hx-ink-2)}
  .pl-food{display:flex;width:100%;align-items:center;gap:.75rem;border:0;border-radius:20px;padding:.9rem 1rem;text-align:left;cursor:pointer;color:#fff;
           background:linear-gradient(135deg,#3a9487,#2a7a70);box-shadow:0 18px 36px -24px rgba(31,77,72,.95)}
  .pl-food b{display:block;font-size:12.5px}
  .pl-food span span{display:block;margin-top:2px;font-size:10.5px;opacity:.8}
  .pl-det summary{display:flex;align-items:center;justify-content:space-between;padding:.95rem 1rem;font-size:12.5px;font-weight:800;color:#123033}
  .pl-det summary::after{content:'▾';color:#5f7479}
  .pl-det[open] summary::after{content:'▴'}
  .pl-det>div{padding:0 1rem 1rem}

  /* ============ FOOD SCREEN (opened from the Plan tab) ============ */
  .fd-chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .fd-chips::-webkit-scrollbar{display:none}
  .fd-chip{flex:none;border-radius:9999px;padding:.5rem .85rem;font-size:11px;font-weight:800;cursor:pointer;
           border:1px solid var(--hx-line);background:var(--hx-surface-2);color:var(--hx-ink-2);transition:background .2s,color .2s}
  .fd-chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--hx-mint-cta-a),var(--hx-mint-cta-b));color:var(--hx-on-mint);border-color:transparent}
  .fd-seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:9999px;background:rgba(18,48,51,.06)}
  .fd-seg button{border:0;border-radius:9999px;padding:.55rem .2rem;font-size:11px;font-weight:800;color:#5b7178;background:transparent;cursor:pointer}
  .fd-seg button[aria-pressed="true"]{background:#fff;color:#1f6b62;box-shadow:0 1px 3px rgba(16,60,58,.12)}
  .fd-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem}
  .fd-tile{border-radius:16px;background:rgba(18,48,51,.045);padding:.55rem .4rem;text-align:center;min-width:0}
  .fd-tile b{display:block;font-family:'Plus Jakarta Sans',Inter,sans-serif;font-size:1.05rem;line-height:1.1;font-weight:800;color:#0f2a2c;
             font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fd-tile span{display:block;margin-top:.3rem;font-size:9.5px;font-weight:700;color:#5c747a}
  .fd-list{list-style:none;margin:0;padding:0}
  .fd-row+.fd-row{border-top:1px solid rgba(18,48,51,.06)}
  .fd-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.35rem .75rem;align-items:end;width:100%;padding:.75rem .1rem .7rem;
           text-align:left;background:none;border:0;cursor:pointer;color:inherit}
  .fd-name{min-width:0;font-size:12.5px;font-weight:800;color:#123033;line-height:1.25}
  .fd-name small{display:block;margin-top:2px;font-size:10px;font-weight:600;color:#4f6870}
  .fd-val{font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:800;color:#123033;white-space:nowrap}
  .fd-val small{display:block;text-align:right;font-size:9px;font-weight:700;color:#9db0b4}
  .fd-track{grid-column:1/-1;display:block;height:12px;border-radius:9999px;background:rgba(18,48,51,.06);overflow:hidden}
  .fd-bar{display:block;height:100%;width:calc(var(--w) * 100%);min-width:6px;border-radius:9999px;
          background:linear-gradient(90deg,var(--s1,#46a597),var(--s2,#2b8074))}
  /* bars grow in when the screen opens or the view changes — not on every redraw */
  .fd-anim .fd-bar{transform-origin:left center;animation:fdgrow .5s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--d,0) * 60ms)}
  @keyframes fdgrow{from{transform:scaleX(0)}}
  @media (prefers-reduced-motion:reduce){.fd-anim .fd-bar{animation:none}}
  .lite .fd-anim .fd-bar{animation:none}
  .fd-trio{grid-column:1/-1;display:grid;gap:5px}
  .fd-part{display:block;margin-top:2px;font-size:10px;font-weight:800;color:#5c747a}
  .fd-mini{display:grid;grid-template-columns:7.9rem minmax(0,1fr) 4rem;align-items:center;gap:.5rem;font-size:10px;font-weight:700;color:#5c747a}
  .fd-mini>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fd-mini .fd-track{grid-column:auto;height:8px}
  .fd-mini b{text-align:right;font-variant-numeric:tabular-nums;color:#123033;white-space:nowrap}
  .fd-lo .fd-bar{background:linear-gradient(90deg,#6fcf9a,#2f9e6f)}
  .fd-hi .fd-bar{background:linear-gradient(90deg,#f0a39a,#d6584a)}
  .fd-one{grid-column:1/-1;display:block;font-size:10.5px;font-weight:600;color:#5c747a}
  .fd-more{font-size:10px;font-weight:800;color:#2b8074}
  .fd-head[aria-expanded="true"] .fd-more{color:#4f6870}
  .fd-detail{padding:0 .1rem .9rem}
  .fd-h{margin:.2rem 0 .45rem;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#5c747a}
  .fd-why{display:flex;align-items:flex-start;gap:.5rem;font-size:11.5px;line-height:1.45;color:var(--hx-ink-2)}
  .fd-why+.fd-why{margin-top:.5rem}
  .fd-tag{flex:none;margin-top:1px;border-radius:9999px;padding:1px 8px;font-size:9.5px;font-weight:800;
          background:linear-gradient(150deg,var(--t1),var(--t2));color:var(--ink)}
  .fd-ref{font-size:9.5px;font-weight:700;color:var(--hx-ink-2);white-space:nowrap}
  .fd-care{margin-top:.6rem;border-radius:12px;padding:.55rem .7rem;background:rgba(231,184,79,.16);color:#7a5012;font-size:11px;font-weight:600;line-height:1.45}
  .fd-money{margin-top:.6rem;border-radius:12px;padding:.55rem .7rem;background:rgba(18,48,51,.045);font-size:10.5px;line-height:1.55;color:#436063}
  .fd-money b{color:#123033}
  .fd-foot{margin-top:.8rem;font-size:10px;line-height:1.5;color:#5f7479}
  .fd-pouch{display:flex;align-items:center;gap:.75rem;border-radius:20px;padding:.85rem 1rem;color:#fff;
            background:linear-gradient(135deg,#3a9487,#2a7a70);box-shadow:0 18px 36px -24px rgba(31,77,72,.95)}
  .fd-pouch b{display:block;font-size:12px}
  .fd-pouch span{display:block;margin-top:2px;font-size:10.5px;line-height:1.4;opacity:.8}

  /* ============ READABILITY: phones in sunlight, older eyes ============
     No word smaller than about 11px, grey text at least 4.5:1 against the page, and anything tappable at least
     ~40–44px tall. Done as overrides so every screen gets it without renaming classes. */
  #main .text-\[9px\],[role=dialog] .text-\[9px\]{font-size:10.5px}
  #main .text-\[10px\],[role=dialog] .text-\[10px\]{font-size:11px}
  .text-\[\#6b8187\],.text-\[\#667d83\],.text-\[\#6b8189\]{color:#4f6870}
  .text-\[\#8a9aa0\],.text-\[\#9db0b4\]{color:#5f7479}
  .ac-ref,.fd-ref{font-size:10.5px}
  .q-card-line,.q-who span,.fd-name small,.fd-mini,.fd-part{font-size:11px}
  .q-total span,.fd-tile span,.fd-val small,.jr-lbl small{font-size:10.5px}
  .availpill{min-height:44px;font-size:12px}
  .fd-chip,.pl-also .fd-chip{min-height:40px}
  .pl-switch summary{display:inline-flex;align-items:center;min-height:44px}
  .q-mini{min-width:40px;height:40px}
  .q-tvbtn{min-height:40px}
  .btn{min-height:40px}
  .chip,.servechip,.tile-l,.q-card-n small,.ac-why b,.ac-how b{font-size:10.5px}
  .pl-switch summary{color:#1f6b62}
  .text-rose-600{color:#a8433a}

  /* ============ SPACING: nothing squashed on a phone ============ */
  .tile-v{margin-top:5px}
  .tile{padding:.6rem .7rem}
  .fd-chips{flex-wrap:wrap;overflow:visible}                 /* wrap: every plan / station visible, none hidden off the edge */
  .st-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:.75rem}
  @media (min-width:560px){.st-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .st-grid .step-input{min-height:48px;font-size:19px}
  .st-grid .step-btn{width:48px;height:48px}
  .pl-more{gap:.9rem}
  .pl-more li>span:last-child{margin-top:3px}
  @media (max-width:399px){.q-totals{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .q-total{padding:.65rem .4rem}
  .jr-steps{gap:6px}
  .vw-bar{gap:.75rem}
  #headerChip,#headerChip span{white-space:nowrap}
  /* Team's four sub-tabs always fit side by side: nothing scrolls off the edge */
  .vt-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  /* blood pressure: label column on the left, the − / value / + control takes the rest of the width */
  .st-bp{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:.7rem .9rem}
  .st-bp .microlabel{margin:0}
  .st-bp .st-warn{grid-column:1/-1;margin-top:-.3rem}
  .st-bp .step-input{min-height:48px;font-size:19px}
  .st-bp .step-btn{width:48px;height:48px}            /* "EXPO-042" never breaks across two lines */

  /* ============ HX PHASE 1 BRIDGE (temporary) ============
     The legacy v3-v8 blocks above still declare the old teal glass. These token rules sit last in the
     cascade so the shell is on the new palette today. Each screen migration deletes its legacy block and
     this bridge shrinks with it; the whole bridge is deleted in Phase 7. No !important, no new layer above. */
  html[data-theme] body{background:var(--hx-canvas);color:var(--hx-ink)}
  html[data-theme] .glass{
    background:var(--hx-glass-bg);border-color:var(--hx-glass-border);box-shadow:var(--hx-glass-shadow);
    border-radius:24px;backdrop-filter:none;-webkit-backdrop-filter:none}
  html[data-theme] .glass-thin{
    background:var(--hx-surface-2);border-color:var(--hx-line);
    backdrop-filter:none;-webkit-backdrop-filter:none}
  html[data-theme] .hero{
    background:var(--hx-hero-bg);border-color:var(--hx-line);color:var(--hx-hero-ink);
    backdrop-filter:none;-webkit-backdrop-filter:none}
  html[data-theme] .btn-primary{background:linear-gradient(180deg,#98f3b4,#68dc8c);color:var(--hx-on-mint)}
  html[data-theme] .btn-glass{background:var(--hx-surface);border-color:var(--hx-line);color:var(--hx-ink);
    backdrop-filter:none;-webkit-backdrop-filter:none}
  html[data-theme] .btn-soft{background:var(--hx-mint-soft);color:var(--hx-mint-deep);border-color:var(--hx-mint-line)}
  html[data-theme] .field,html[data-theme] .step-input{
    background:var(--hx-field-bg);border-color:var(--hx-field-border);color:var(--hx-ink)}
  html[data-theme] .field::placeholder{color:var(--hx-ink-3)}
  html[data-theme] .field:focus,html[data-theme] .step-input:focus{
    border-color:var(--hx-mint);background:var(--hx-surface);box-shadow:0 0 0 4px var(--hx-field-ring)}
  html[data-theme] .tile{background:var(--hx-surface);border-color:var(--hx-line)}
  html[data-theme] .tile-l{color:var(--hx-ink-3)}
  html[data-theme] .tile-v{color:var(--hx-ink)}
  html[data-theme] .chip-ok{background:var(--hx-mint-soft);border-color:var(--hx-mint-line);color:var(--hx-mint-deep)}
  html[data-theme] .chip-watch{background:var(--hx-warn-bg);border-color:var(--hx-warn-line);color:var(--hx-warn)}
  html[data-theme] .chip-flag{background:var(--hx-rose-bg);border-color:var(--hx-rose-line);color:var(--hx-rose)}
  html[data-theme] .chip-none{background:var(--hx-line-soft);border-color:var(--hx-line);color:var(--hx-ink-3)}
  html[data-theme] .nav-item{color:var(--hx-ink-3)}
  html[data-theme] .nav-item-active{color:var(--hx-mint-deep);background:var(--hx-mint-soft)}
  html[data-theme] .nav-pill{background-color:var(--hx-mint-soft);background-image:none;
    border:1px solid var(--hx-mint-line)}
  html[data-theme] .microlabel{color:var(--hx-ink-2)}

  /* ============ HX COMPONENTS (phase 2) ============ */
  .hx-hero{position:relative;overflow:hidden;border-radius:var(--hx-r-hero);padding:16px 16px 14px;
    background:var(--hx-hero-bg);color:var(--hx-hero-ink);border:1px solid var(--hx-line);
    box-shadow:0 18px 40px -30px rgba(18,38,26,.45)}
  .hx-eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;color:var(--hx-hero-sub)}
  .hx-id{font-size:48px;font-weight:700;letter-spacing:-2px;line-height:1.02;font-variant-numeric:tabular-nums;margin:2px 0}
  .hx-name{font-size:15.5px;font-weight:650;letter-spacing:-.2px;overflow-wrap:anywhere}
  .hx-name span{color:var(--hx-hero-sub);font-weight:450}

  .hx-ecg{position:relative;height:70px;overflow:hidden;pointer-events:none;opacity:.55;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 10%,#000 90%,transparent)}
  .hx-ecg svg{display:block;width:100%;height:100%}
  .hx-ecg-track{fill:none;stroke:var(--hx-mint);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.45}
  .hx-ecg-scan{position:absolute;top:0;bottom:0;left:0;width:22%;transform:translateX(-120%);
    background:linear-gradient(90deg,transparent,rgba(52,211,117,.55),transparent);
    animation:hxScan 2.6s linear infinite}
  @keyframes hxScan{to{transform:translateX(560%)}}
  /* lub-dub: two quick swells then rest, on the same 2.6s cycle as the scan so they stay in step.
     Opacity only — a box-shadow or filter glow repaints the hero every frame on a weak phone. */
  .hx-ecg-beat{position:absolute;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(60% 120% at 50% 50%,rgba(52,211,117,.38),transparent 70%);
    animation:hxBeat 2.6s ease-in-out infinite}
  @keyframes hxBeat{0%,100%{opacity:0}6%{opacity:.85}13%{opacity:.2}20%{opacity:.6}34%{opacity:0}}
  html.lite .hx-ecg-scan,html.page-hidden .hx-ecg-scan,
  html.lite .hx-ecg-beat,html.page-hidden .hx-ecg-beat{animation:none;opacity:0}
  @media (prefers-reduced-motion:reduce){.hx-ecg-scan,.hx-ecg-beat{animation:none;opacity:0}}

  .hx-capsule{display:inline-flex;align-items:center;gap:6px;min-height:28px;padding:4px 12px;border-radius:999px;
    background:var(--hx-mint-soft);border:1px solid var(--hx-mint-line);color:var(--hx-mint-deep);
    font-size:11.5px;font-weight:700}
  .hx-capsule i{width:6px;height:6px;border-radius:50%;background:var(--hx-mint);flex:none}

  .hx-ruler{position:relative;height:20px;margin:12px 4px 2px;opacity:.55;background-repeat:no-repeat;
    background-image:repeating-linear-gradient(90deg,var(--hx-ink-2) 0 1px,transparent 1px 48px),
      repeating-linear-gradient(90deg,var(--hx-line) 0 1px,transparent 1px 8px);
    background-size:100% 16px,100% 9px;background-position:center bottom;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 18%,#000 82%,transparent)}
  .hx-ruler-pin{position:absolute;bottom:0;width:2px;height:20px;background:var(--hx-mint);
    box-shadow:0 0 8px var(--hx-mint);transform:translateX(-50%)}

  .hx-tile{position:relative;overflow:hidden;border-radius:22px;padding:12px 11px 11px;min-height:128px;
    display:flex;flex-direction:column;justify-content:space-between;color:#fff;
    border:1px solid rgba(255,255,255,.18);box-shadow:0 10px 22px -14px rgba(0,0,0,.55)}
  .hx-tile-head{display:flex;align-items:flex-start;justify-content:space-between;gap:4px}
  .hx-tile-label{font-size:10px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;line-height:1.15}
  .hx-tile-icon{width:22px;height:22px;border-radius:7px;background:rgba(0,0,0,.25);display:grid;place-items:center;flex:none}
  .hx-tile-icon svg{width:12px;height:12px}
  .hx-tile-value{font-size:clamp(18px,5.6vw,22px);font-weight:800;letter-spacing:-.8px;line-height:1.05;
    margin:4px 0 6px;font-variant-numeric:tabular-nums}
  .hx-tile-status{font-size:11px;font-weight:700;color:rgba(255,255,255,.92)}
  .hx-tile-ruby{background:radial-gradient(circle at 85% 85%,rgba(255,120,95,.22),transparent 60%),linear-gradient(155deg,#a81c1c,#881212 55%,#630c0c)}
  /* amber darkened from the reference #c7740e (white text 3.54:1) to meet AA for the 10-11px labels */
  .hx-tile-amber{background:radial-gradient(circle at 80% 75%,rgba(255,235,170,.20),transparent 60%),linear-gradient(155deg,#9a5105,#7d3f03 55%,#5f2f02)}
  .hx-tile-cobalt{background:radial-gradient(circle at 82% 50%,rgba(210,238,255,.22),transparent 60%),linear-gradient(160deg,#326ea8,#235485 55%,#15385c)}

  .hx-split{display:inline-flex;align-items:center;gap:2px;min-height:44px}
  .hx-split-label{height:25px;padding:0 11px;border-radius:999px;background:#fff;color:#141815;
    font-size:11.5px;font-weight:700;display:inline-flex;align-items:center;white-space:nowrap}
  .hx-split-circle{width:25px;height:25px;border-radius:50%;background:#fff;color:#141815;display:grid;place-items:center;flex:none}
  .hx-split-circle svg,.hx-cta-circle svg{width:14px;height:14px}
  .hx-split-mint .hx-split-label,.hx-split-mint .hx-split-circle{background:linear-gradient(180deg,var(--hx-mint-pill-a),var(--hx-mint-pill-b));color:var(--hx-on-mint)}
  .hx-cta{display:flex;align-items:center;gap:4px;width:100%;min-height:48px}
  .hx-cta-main{flex:1;height:48px;border-radius:999px;background:#fff;color:#111814;font-size:14.5px;font-weight:750;
    letter-spacing:-.25px;display:flex;align-items:center;justify-content:center;gap:8px;
    box-shadow:0 10px 24px -14px rgba(0,0,0,.35)}
  .hx-cta-circle{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;color:var(--hx-on-mint);
    background:linear-gradient(145deg,var(--hx-mint-cta-a),var(--hx-mint-cta-b));box-shadow:0 10px 22px -14px rgba(21,128,61,.6)}

  .hx-ivory{border-radius:26px;padding:16px 15px;color:#141715;border:1px solid rgba(20,24,21,.06);
    background:linear-gradient(180deg,#f5f4ef,#eeede6);box-shadow:0 16px 36px -26px rgba(0,0,0,.35)}
  .hx-ivory-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:10px}
  .hx-ivory h3{margin:0;font-size:18px;font-weight:750;letter-spacing:-.4px}
  .hx-ivory-sub{margin:2px 0 0;font-size:11.5px;color:#545b53}
  .hx-spectrum{display:flex;height:20px;border-radius:6px;overflow:hidden;gap:1.5px;margin-bottom:12px;background:rgba(0,0,0,.08)}
  .hx-spectrum i{display:block;height:100%}
  .hx-seg-orange{background:linear-gradient(90deg,#e45d29,#db7123)}
  .hx-seg-amber{background:linear-gradient(90deg,#cf821b,#bf931b)}
  .hx-seg-lime{background:#a5ad1d}
  .hx-seg-green{background:#3f9941}
  .hx-seg-purple{background:#622585}
  .hx-row{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;min-height:48px;
    padding:9px 11px;border-radius:14px;background:rgba(255,255,255,.65);border:1px solid rgba(20,24,21,.06);margin-bottom:6px}
  .hx-row:last-child{margin-bottom:0}
  .hx-row-main{display:flex;align-items:center;gap:10px;min-width:0}
  .hx-row-dot{width:8px;height:8px;border-radius:50%;flex:none}
  .hx-row-name{display:block;font-size:13.5px;font-weight:700;color:#141715}
  .hx-row-sub{display:block;font-size:11px;color:#545b53;font-variant-numeric:tabular-nums}
  .hx-row-badge{flex:none;border-radius:999px;padding:3px 9px;background:#141815;color:#fff;font-size:10.5px;font-weight:700}

  .hx-banner{border-radius:22px;padding:14px 15px;color:#fff;border:1px solid rgba(255,255,255,.15);
    background:linear-gradient(155deg,#3d6e4a,#2a5236 55%,#1c3d26);box-shadow:0 12px 28px -22px rgba(0,0,0,.6);
    display:flex;flex-direction:column;gap:8px}
  .hx-banner-top{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:12px;font-weight:600}
  .hx-banner-top em{font-style:normal;opacity:.75;font-size:11px}
  .hx-banner-bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
  .hx-banner-bottom strong{font-size:16px;font-weight:700;letter-spacing:-.3px;line-height:1.15}
  .hx-banner-note{font-size:10.5px;font-weight:600;color:rgba(255,255,255,.78);line-height:1.3}

  /* ---- hero top bar, practice banner, sheet chrome (mockup composition) ---- */
  .hx-hero-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
  .hx-staff{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:4px 10px 4px 4px;
    border-radius:999px;border:1px solid rgba(255,255,255,.08);background:#141815;color:#fff;
    font:inherit;cursor:pointer;max-width:72%}
  html[data-theme=dark] .hx-staff{background:#242823;border-color:rgba(255,255,255,.10)}
  .hx-staff-av{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;
    font-size:11px;font-weight:800;color:#fff;flex:none}
  .hx-staff-meta{display:flex;align-items:baseline;gap:4px;font-size:11.5px;font-weight:650;white-space:nowrap;overflow:hidden}
  .hx-staff-meta b{font-weight:800}
  .hx-staff-meta span{color:rgba(255,255,255,.65);font-weight:500}
  .hx-staff>svg{width:12px;height:12px;color:rgba(255,255,255,.65);flex:none}
  .hx-hero-tools{display:inline-flex;align-items:center;gap:6px;flex:none}
  .hx-theme{display:inline-flex;align-items:center;gap:5px;height:30px;padding:0 10px;border-radius:999px;
    border:1px solid var(--hx-line);background:var(--hx-surface);color:var(--hx-ink-2);
    font:inherit;font-size:11.5px;font-weight:700;cursor:pointer}
  .hx-theme svg{width:12px;height:12px}
  .hx-theme-dark{display:none}
  html[data-theme=dark] .hx-theme-light{display:none}
  html[data-theme=dark] .hx-theme-dark{display:inline}
  .hx-round{position:relative;width:30px;height:30px;padding:0;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    border:1px solid var(--hx-line);background:var(--hx-surface);color:var(--hx-ink-2)}
  .hx-notif-dot{position:absolute;right:-3px;top:-3px;min-width:14px;height:14px;padding:0 3px;border-radius:999px;
    background:#dc3522;color:#fff;font-size:8.5px;font-weight:800;line-height:14px;text-align:center;display:none;place-items:center}
  .hx-cloud-dot{position:absolute;right:-1px;bottom:-1px;width:8px;height:8px;border-radius:50%;
    background:#9db0b4;box-shadow:0 0 0 1.5px var(--hx-surface)}
  .hx-round svg{width:13px;height:13px}
  .hx-round-ivory{border-color:rgba(20,24,21,.12);background:rgba(20,24,21,.05);color:#141715}
  .hx-practice{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 15px;
    border-radius:22px;background:var(--hx-surface);border:1px solid var(--hx-line)}
  .hx-practice-copy{display:flex;flex-direction:column;gap:2px;min-width:0}
  .hx-practice-copy b{font-size:14.5px;font-weight:700;letter-spacing:-.2px}
  .hx-practice-copy span{font-size:11.5px;color:var(--hx-ink-2)}
  .hx-practice-go{border:0;background:none;padding:0;cursor:pointer;font:inherit;flex:none}
  .hx-tile-foot{display:flex;margin-top:6px}
  .hx-tile-foot .hx-split{min-height:25px}
  .hx-sheet-meta{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:5px;font-size:11.5px}
  .hx-sheet-meta strong{font-size:12.5px;font-weight:700}
  .hx-sheet-meta span{color:#545b53}
  .hx-sheet-actions{display:flex;justify-content:flex-end;gap:12px;padding-top:10px;font-size:10.5px;font-weight:700}
  .hx-sheet-actions button{border:0;background:none;padding:0;cursor:pointer;color:#545b53;font:inherit}
  button.hx-row{font:inherit;text-align:left;cursor:pointer}
  .hx-row.is-on{background:#fff;border-color:rgba(34,197,94,.45)}
  .inline{display:inline}

  /* CTA inverts with the theme, exactly as the two references do. */
  .hx-cta-main{background:#141815;color:#fff}
  html[data-theme=dark] .hx-cta-main{background:#fff;color:#111814}

  /* Dock: the reference capsule, not the old teal pill. */
  html[data-theme] #navBar{background:var(--hx-dock);border:1px solid var(--hx-dock-line);
    border-radius:999px;box-shadow:var(--hx-dock-shadow);padding:4px 6px;
    backdrop-filter:none;-webkit-backdrop-filter:none}
  html[data-theme] .nav-item{font-size:10.5px;color:var(--hx-ink-2)}
  html[data-theme] .nav-item-active{color:var(--hx-on-mint);background:transparent}
  html[data-theme] .nav-pill{background:linear-gradient(180deg,var(--hx-mint-dock-a),var(--hx-mint-dock-b));
    background-image:linear-gradient(180deg,var(--hx-mint-dock-a),var(--hx-mint-dock-b));
    border:0;border-radius:999px;box-shadow:0 4px 12px -4px rgba(21,128,61,.45)}

  /* ---- Sign-in gate: full-screen passport composition ---- */
  #authGate{align-items:flex-start;justify-content:center;background:var(--hx-canvas);
    padding:max(12px,calc(var(--safe-area-inset-top,0px) + 8px),calc(env(safe-area-inset-top,0px) + 8px)) 12px
      max(16px,calc(var(--safe-area-inset-bottom,0px) + 12px),calc(env(safe-area-inset-bottom,0px) + 12px))}
  #authGate.hidden{display:none}
  .hx-gate{width:100%;max-width:448px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
  .hx-gate-hero{min-height:231px}
  .hx-staff-static{cursor:default}
  .hx-gate-card{background:var(--hx-surface);border:1px solid var(--hx-line);border-radius:22px;
    padding:16px 15px;color:var(--hx-ink);box-shadow:0 18px 40px -30px rgba(18,38,26,.35)}
  .hx-gate-title{color:var(--hx-ink);font-size:18px;letter-spacing:-.4px;line-height:1.2}
  .hx-gate-card .microlabel{color:var(--hx-ink-2)}
  .hx-gate-card .text-brand-700,.hx-gate-card .text-brand-900{color:var(--hx-mint-deep)}
  .hx-gate-card .text-rose-600{color:var(--hx-rose)}
  .hx-gate-card .field{margin-top:4px}
  .hx-gate-card form .field{background:var(--hx-field-bg);border-color:var(--hx-field-border);color:var(--hx-ink)}
  .hx-gate-submit{display:flex;width:100%;border:0;background:none;padding:0;margin-top:4px;font:inherit;cursor:pointer}
  .hx-gate-submit:disabled{opacity:.6;cursor:wait}
  .hx-gate .btn-primary{background:#141815;color:#fff;border-radius:999px;min-height:44px;box-shadow:none}
  html[data-theme=dark] .hx-gate .btn-primary{background:#fff;color:#111814}
  .hx-gate .btn-glass{background:var(--hx-surface-2);border-color:var(--hx-line);color:var(--hx-ink)}
  .hx-gate .btn-soft{background:var(--hx-mint-soft);color:var(--hx-mint-deep);border-color:var(--hx-mint-line)}
  html[data-theme=dark] .hx-gate .text-\[\#0f2a2c\],
  html[data-theme=dark] .hx-gate .text-\[\#123033\],
  html[data-theme=dark] .hx-gate .text-\[\#33504f\]{color:var(--hx-ink)}
  html[data-theme=dark] .hx-gate .text-\[\#5c747a\],
  html[data-theme=dark] .hx-gate .text-\[\#4f6870\],
  html[data-theme=dark] .hx-gate .text-\[\#6b8187\],
  html[data-theme=dark] .hx-gate .text-\[\#8a9aa0\]{color:var(--hx-ink-2)}
  .hx-gate-sandbox{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .hx-gate-tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;gap:8px;
    min-height:128px;padding:12px 11px;border-radius:22px;border:1px solid rgba(255,255,255,.18);
    color:#fff;text-align:left;font:inherit;cursor:pointer;overflow:hidden;
    box-shadow:0 10px 22px -14px rgba(0,0,0,.55)}
  .hx-gate-tile-mint{background:radial-gradient(circle at 20% 20%,rgba(180,245,205,.22),transparent 60%),linear-gradient(145deg,#2d7d4c,#1f5e37 55%,#123e23)}
  .hx-gate-tile-amber{background:radial-gradient(circle at 80% 75%,rgba(255,235,170,.20),transparent 60%),linear-gradient(155deg,#9a5105,#7d3f03 55%,#5f2f02)}
  .hx-gate-tile-head{display:flex;align-items:flex-start;justify-content:space-between;gap:6px;
    font-size:12.5px;font-weight:800;line-height:1.15}
  .hx-gate-tile-ico{opacity:.9;display:inline-flex}
  .hx-gate-tile-sub{font-size:10.5px;font-weight:600;color:rgba(255,255,255,.88);line-height:1.3}
  .hx-gate-tile .hx-split{min-height:25px}
  .hx-gate-tile .hx-split-label,.hx-gate-tile .hx-split-circle{background:#fff;color:#141815}

  /* ---- Dark-mode bridge for screens not yet structurally migrated ----
     The legacy templates use ~330 hardcoded hex utilities. Remapping the most-used ones to tokens keeps
     every screen legible in dark while its markup waits in the migration queue. Scoped to dark only. */
  html[data-theme=dark] :is(.text-\[\#123033\],.text-\[\#33504f\],.text-\[\#0f2a2c\]){color:var(--hx-ink)}
  html[data-theme=dark] :is(.text-\[\#5b7178\],.text-\[\#5c747a\],.text-\[\#4f6870\],.text-\[\#3d5c5e\]){color:var(--hx-ink-2)}
  html[data-theme=dark] :is(.text-\[\#6b8187\],.text-\[\#667d83\],.text-\[\#8a9aa0\]){color:var(--hx-ink-3)}
  html[data-theme=dark] .text-\[\#8a5a12\]{color:var(--hx-warn)}
  html[data-theme=dark] :is(.bg-white\/60,.bg-white\/50,.bg-white\/70,.bg-white\/85,.bg-white\/40){background-color:rgba(255,255,255,.06)}
  html[data-theme=dark] .bg-white{background-color:var(--hx-surface)}
  html[data-theme=dark] .bg-\[\#123033\]{background-color:var(--hx-surface-3)}
  html[data-theme=dark] .border-\[\#123033\]{border-color:var(--hx-line)}
  html[data-theme=dark] :is(.text-brand-600,.text-brand-700,.text-brand-800,.text-brand-900){color:var(--hx-mint-deep)}
  html[data-theme=dark] :is(.text-rose-600,.text-rose-700){color:var(--hx-rose)}
  html[data-theme=dark] :is(.text-amber-600,.text-amber-700,.text-amber-800){color:var(--hx-warn)}
  html[data-theme=dark] .text-sky-800{color:#7dd3fc}

  /* screen-specific surfaces still on their pre-token CSS */
  html[data-theme=dark] :is(.q-card,.q-row,.ac-card,.snd-item,.jr,.sim-panel,.fd-tile,.fd-row,.vw-bar){background:var(--hx-surface);border-color:var(--hx-line)}
  html[data-theme=dark] .vw-bar{color:var(--hx-ink-2)}
  html[data-theme=dark] .vw-bar b{color:var(--hx-ink)}
  html[data-theme=dark] .q-card-sel{border-color:var(--hx-mint)}
  html[data-theme=dark] :is(.q-card-name,.q-card-n,.vw-bar b,.q-who b){color:var(--hx-ink)}
  html[data-theme=dark] :is(.vw-bar,.q-card-n small,.q-card-line,.q-pos,.q-label,.q-note,.q-empty){color:var(--hx-ink-2)}
  html[data-theme=dark] :is(.bg-rose-50\/70,.bg-rose-50\/80,.bg-rose-50\/90){background:var(--hx-rose-bg);border-color:var(--hx-rose-line);color:var(--hx-rose)}
  html[data-theme=dark] :is(.bg-amber-50\/70,.bg-amber-50\/80){background:var(--hx-warn-bg);border-color:var(--hx-warn-line);color:var(--hx-warn)}
  html[data-theme=dark] .bg-lilac-50\/90{background:rgba(168,85,247,.14);border-color:rgba(168,85,247,.28);color:#d8b4fe}
  html[data-theme=dark] .bg-sage-50\/90{background:var(--hx-mint-soft);border-color:var(--hx-mint-line);color:var(--hx-mint-deep)}
  html[data-theme=dark] :is(.bg-sky-50\/70,.bg-sky-50\/80){background:rgba(56,189,248,.12);border-color:rgba(56,189,248,.25);color:#7dd3fc}
  html[data-theme=dark] .text-lilac-700{color:#d8b4fe}
  html[data-theme=dark] .text-sage-800{color:var(--hx-mint-deep)}

  /* ---- AA: 44px hit areas without changing the picture, focus, 320px ---- */
  .hx-staff,.hx-theme{position:relative}
  .hx-theme::after,.hx-staff::after{content:"";position:absolute;left:0;right:0;top:-7px;bottom:-7px;border-radius:inherit}
  .hx-round::after{content:"";position:absolute;inset:-7px;border-radius:50%}
  .hx-round:focus-visible,.hx-theme:focus-visible,.hx-staff:focus-visible,
  .hx-split:focus-visible,.nav-item:focus-visible{
    outline:2px solid var(--hx-mint);outline-offset:3px}
  @media (max-width:360px){
    .hx-theme span{display:none}
    .hx-theme{width:30px;padding:0;justify-content:center;gap:0}
    .hx-hero-top{gap:6px}
    .hx-staff{max-width:58%;min-width:0;overflow:hidden}
    .hx-staff-meta{min-width:0;overflow:hidden}
    .hx-tile{padding:10px 8px}
    .hx-tile-value{font-size:16px;letter-spacing:-.5px}
    .hx-tile-head{gap:2px}
    .hx-tile-icon{width:18px;height:18px}
    .hx-tile-foot .hx-split{gap:1px;min-height:22px}
    .hx-tile-foot .hx-split-label{height:22px;padding:0 7px;font-size:9.5px}
    .hx-tile-foot .hx-split-circle{width:22px;height:22px}
  }
  @media (max-width:340px){
    .nav-item{font-size:9.5px}
    .nav-ico{width:34px}
  }
  /* the active dock pill is mint in both themes; legacy templates add text-white to its label */
  .nav-item-active .nav-lbl{color:#0b0e0c}
  /* the active item itself is the mint pill: axe can then verify the label contrast;
     the separate sliding pill is retired (it sat behind the text and confused automated checks). */
  html[data-theme] .nav-item-active{color:#0b0e0c;
    background:linear-gradient(180deg,var(--hx-mint-dock-a),var(--hx-mint-dock-b));
    border-radius:999px;box-shadow:0 4px 12px -4px rgba(21,128,61,.45)}
  html[data-theme] #navPill{display:none}

</style>
</head>
<body>
<!-- intro: the app's logo, shown from the very first paint (before any script runs); the script below lets it go -->
<div id="intro" aria-hidden="true"><div class="intro-badge"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg></div></div>

<div id="app" class="relative z-10 mx-auto flex w-full max-w-md flex-col" style="min-height:100vh;min-height:100dvh">

  <!-- ===== Header ===== -->
  <!-- the top padding keeps the header clear of the phone's status bar: Capacitor's measured size in the app, env() in browsers -->
  <header class="sticky top-0 z-30 px-3" style="padding-top:max(.75rem,calc(var(--safe-area-inset-top,0px) + .5rem),calc(env(safe-area-inset-top,0px) + .5rem))">
    <div class="glass flex items-center justify-between gap-2 rounded-[22px] px-3 py-2.5">
      <div class="hdr-brand flex items-center gap-2.5">
        <button id="cloudBtn" data-action="openCloud" aria-label="Cloud sync status" title="Cloud sync"
             class="relative flex h-9 w-9 flex-none items-center justify-center rounded-[14px] text-white"
             style="background:linear-gradient(145deg,#34d375,#15803d);box-shadow:0 8px 18px -10px rgba(21,128,61,.55),inset 0 1px 0 rgba(255,255,255,.35)">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          <span id="cloudDot" data-cloud-dot style="position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:9999px;background:#9db0b4;border:2px solid #fff"></span>
        </button>
        <div class="hdr-title leading-tight" style="white-space:nowrap">
          <div class="display text-[15px] font-extrabold tracking-tight text-[#123033]">Health Expo Passport</div>
        </div>
      </div>
      <div class="hdr-tools flex items-center gap-2">
        <button id="notifBell" data-action="openNotifs" data-notif-bell-hide aria-label="Notifications" title="Notifications"
          class="btn btn-glass relative hidden h-9 w-9 flex-none items-center justify-center rounded-[14px]">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/></svg>
          <span id="notifDot" data-notif-dot style="display:none;position:absolute;right:-4px;top:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9999px;background:#d88a55;border:2px solid #fff;color:#fff;font-size:9px;font-weight:800;line-height:13px;text-align:center"></span>
        </button>
        <button id="headerChip" data-action="switcher-open" aria-label="Switch visitor or volunteer"
          class="btn btn-glass h-9 gap-1.5 rounded-full py-0 pl-1 pr-2.5"></button>
      </div>
    </div>
  </header>

  <main id="main" class="flex-1 px-3 pb-4 pt-3"></main>

  <!-- ===== Floating glass nav ===== -->
  <nav class="sticky bottom-0 z-30 px-3 pb-3 pt-1" style="padding-bottom:max(.75rem,calc(var(--safe-area-inset-bottom,0px) + .5rem),calc(env(safe-area-inset-bottom,0px) + .5rem))">
    <div id="navBar" class="glass relative rounded-[24px] p-1.5"><span class="nav-goo" aria-hidden="true"><span id="navPill" class="nav-pill"></span></span><div id="navItems" class="relative flex items-stretch gap-1"></div></div>
  </nav>
</div>

<!-- ===== Attendee switcher ===== -->
<div id="switcherModal" role="dialog" aria-modal="true" class="fixed inset-0 z-50 hidden items-end bg-[#0b1a1c]/40 backdrop-blur-md" data-action="closeSwitcher" data-backdrop="1">
  <div class="glass sheet-up mx-auto w-full max-w-md rounded-b-none rounded-t-[28px] p-5">
    <div class="mx-auto mb-4 h-1.5 w-10 rounded-full bg-[#123033]/10"></div>
    <div id="switcherHead"></div>
    <div id="switcherList" class="mt-3 max-h-[52vh] space-y-1.5 overflow-y-auto no-scrollbar"></div>
    <div id="switcherFoot" class="mt-3"></div>
  </div>
</div>

<!-- ===== Live queue: big screen (TV / projector). Badge numbers only — never names. ===== -->
<div id="tv" class="q-tv hidden" role="dialog" aria-modal="true" aria-label="Queue board">
  <div class="q-tv-top">
    <div><div class="q-tv-title">Health Expo · Queue</div><div id="tvState" class="q-tv-sub info"></div></div>
    <div class="q-tv-right"><span id="tvClock" class="q-tv-clock"></span>
      <button class="q-tv-x" data-action="closeBigScreen" aria-label="Close big screen">✕</button></div>
  </div>
  <div id="tvGrid" class="q-tv-grid"></div>
</div>

<!-- ===== Live queue: add a visitor to a station's line ===== -->
<div id="queueModal" role="dialog" aria-modal="true" aria-label="Add a visitor to the queue" class="fixed inset-0 z-50 hidden items-end bg-[#0b1a1c]/40 backdrop-blur-md" data-action="closeQueuePick" data-backdrop="1">
  <div class="glass sheet-up mx-auto w-full max-w-md rounded-b-none rounded-t-[28px] p-5">
    <div class="mx-auto mb-4 h-1.5 w-10 rounded-full bg-[#123033]/10"></div>
    <div id="queueHead"></div>
    <div id="queueList" class="mt-3 max-h-[52vh] space-y-1 overflow-y-auto no-scrollbar"></div>
    <button data-action="closeQueuePick" class="btn btn-glass mt-3 w-full py-2.5 text-xs">Done</button>
  </div>
</div>

<!-- ===== Notifications hub (the bell) ===== -->
<div id="notifSheet" role="dialog" aria-modal="true" aria-label="Notifications" class="fixed inset-0 z-50 hidden items-end bg-[#0b1a1c]/40 backdrop-blur-md" style="z-index:70" data-action="notif-close" data-backdrop="1">
  <div class="glass sheet-up mx-auto w-full max-w-md rounded-b-none rounded-t-[28px] p-5">
    <div class="mx-auto mb-4 h-1.5 w-10 rounded-full bg-[#123033]/10"></div>
    <div id="notifBody" class="max-h-[52vh] overflow-y-auto no-scrollbar"></div>
    <button data-action="notif-close" class="btn btn-glass mt-3 w-full py-2.5 text-xs">Close</button>
  </div>
</div>

<!-- ===== Placement board: move, swap, release, make team leader (admins and station leaders) ===== -->
<div id="placeSheet" role="dialog" aria-modal="true" aria-label="Place volunteer" class="fixed inset-0 z-50 hidden items-end bg-[#0b1a1c]/40 backdrop-blur-md" data-action="place-close" data-backdrop="1">
  <div class="glass sheet-up mx-auto w-full max-w-md rounded-b-none rounded-t-[28px] p-5">
    <div class="mx-auto mb-4 h-1.5 w-10 rounded-full bg-[#123033]/10"></div>
    <div id="placeBody" class="max-h-[52vh] overflow-y-auto no-scrollbar"></div>
    <button data-action="place-close" class="btn btn-glass mt-3 w-full py-2.5 text-xs">Done</button>
  </div>
</div>

<!-- ===== Cloud sync / staff sign-in ===== -->
<div id="cloudModal" role="dialog" aria-modal="true" aria-label="Cloud sync" class="fixed inset-0 z-50 hidden items-end bg-[#0b1a1c]/40 backdrop-blur-md" data-action="closeCloud" data-backdrop="1">
  <div class="glass sheet-up mx-auto w-full max-w-md rounded-b-none rounded-t-[28px] p-5">
    <div class="mx-auto mb-4 h-1.5 w-10 rounded-full bg-[#123033]/10"></div>
    <div id="cloudBody"></div>
  </div>
</div>

<!-- ===== Account hub: my details, my church's members, every church for the platform admin ===== -->
<div id="acctSheet" role="dialog" aria-modal="true" aria-label="Account hub" class="fixed inset-0 hidden items-end bg-[#0b1a1c]/40 backdrop-blur-md" style="z-index:70" data-action="closeAcct" data-backdrop="1">
  <div class="glass sheet-up mx-auto flex max-h-[92vh] w-full max-w-md flex-col rounded-b-none rounded-t-[28px] p-5">
    <div class="mx-auto mb-4 h-1.5 w-10 rounded-full bg-[#123033]/10"></div>
    <div id="acctTabs"></div>
    <div id="acctBody" class="mt-3 flex-1 overflow-y-auto no-scrollbar"></div>
    <button data-action="closeAcct" class="btn btn-glass mt-3 w-full py-2.5 text-xs">Close</button>
  </div>
</div>

<!-- ===== Incoming expo / volunteer pledge ===== -->
<div id="volModal" role="dialog" aria-modal="true" class="fixed inset-0 z-50 hidden items-center justify-center bg-[#0b1a1c]/50 p-4 backdrop-blur-md" data-action="closeVolModal" data-backdrop="1">
  <div class="glass modal-in flex max-h-[92vh] w-full max-w-md flex-col overflow-hidden rounded-[28px]">
    <div class="flex items-center justify-between px-5 py-3.5 text-white"
         style="background:linear-gradient(135deg,#d89455,#b86f30)">
      <div class="flex items-center gap-3">
        <div class="flex h-9 w-9 items-center justify-center rounded-full bg-white/20 text-xs font-extrabold backdrop-blur">EX</div>
        <div>
          <div id="volModalTitle" class="text-sm font-bold">Incoming Health Expo</div>
          <div id="volModalSub" class="text-[10px] text-white/80">Pledge your help</div>
        </div>
      </div>
      <button data-action="closeVolModal" aria-label="Close" class="text-white/70 transition hover:text-white">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="volBody" class="flex-1 space-y-3 overflow-y-auto bg-white/40 p-4"></div>
    <div class="flex gap-2 border-t border-white/60 bg-white/50 p-3 backdrop-blur">
      <button data-action="vol-modal-team" class="btn btn-glass flex-1 py-2.5 text-[11px] text-[#5b7178]">See the team</button>
      <button data-action="vol-modal-new" class="btn flex-1 py-2.5 text-[11px] text-white"
        style="background:linear-gradient(135deg,#d89455,#b86f30);box-shadow:0 12px 24px -14px rgba(184,111,48,.9)">Pledge to help →</button>
    </div>
  </div>
</div>

<!-- ===== WhatsApp report ===== -->
<div id="waModal" role="dialog" aria-modal="true" class="fixed inset-0 z-50 hidden items-center justify-center bg-[#0b1a1c]/50 p-4 backdrop-blur-md" data-action="closeWhatsApp" data-backdrop="1">
  <div class="glass modal-in flex max-h-[92vh] w-full max-w-md flex-col overflow-hidden rounded-[28px]">
    <div class="flex items-center justify-between px-5 py-3.5 text-white"
         style="background:linear-gradient(145deg,#34d375,#15803d)">
      <div class="flex items-center gap-3">
        <div class="flex h-9 w-9 items-center justify-center rounded-full bg-white/20 text-xs font-extrabold backdrop-blur">NS</div>
        <div>
          <div class="text-sm font-bold">Health Expo Team</div>
          <div class="text-[10px] text-white/75" id="waSub">Message preview · opens in WhatsApp</div>
        </div>
      </div>
      <button data-action="closeWhatsApp" aria-label="Close" class="text-white/70 transition hover:text-white">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="waBody" class="flex-1 space-y-3 overflow-y-auto bg-white/40 p-4"></div>
    <div id="waFoot" class="flex gap-2 border-t border-white/60 bg-white/50 p-3 backdrop-blur">
      <button data-action="recycleBadge" class="btn btn-glass flex-1 py-2.5 text-[11px] text-[#5b7178]">Recycle badge</button>
      <button data-action="sendWhatsApp"
        class="btn flex-1 py-2.5 text-[11px] text-white"
        style="background:linear-gradient(135deg,#25D366,#1aa851);box-shadow:0 12px 24px -14px rgba(37,211,102,.9)">Send in WhatsApp →</button>
    </div>
  </div>
</div>

<!-- ===== Print target ===== -->
<!-- ===== Sign-in gate: nothing behind it is usable until a staff member has signed in ===== -->
<div id="authGate" role="dialog" aria-modal="true" aria-label="Staff sign-in"
     class="fixed inset-0 hidden overflow-y-auto" style="z-index:65">
 <div class="hx-gate">
  <section class="hx-hero hx-gate-hero">
   <div style="position:absolute;inset:0;top:50%;transform:translateY(-50%)">
    <div class="hx-ecg" aria-hidden="true">
     <svg viewBox="0 0 340 70" preserveAspectRatio="none" focusable="false">
      <path class="hx-ecg-track" d="M 0 35 L 50 35 L 64 35 L 72 31 Q 78 28 84 35 L 96 35 L 102 41 L 114 8 L 126 62 L 136 31 Q 148 24 162 35 L 195 35 L 210 35 L 218 31 Q 224 28 230 35 L 242 35 L 248 41 L 260 8 L 272 62 L 282 31 Q 294 24 308 35 L 340 35"/>
     </svg><span class="hx-ecg-scan"></span><span class="hx-ecg-beat"></span>
    </div>
   </div>
   <div style="position:relative">
    <div class="hx-hero-top">
     <span class="hx-staff hx-staff-static">
      <span class="hx-staff-av" style="background:linear-gradient(145deg,#34d375,#15803d)">
       <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
      </span>
      <span class="hx-staff-meta"><b>HealthExpo</b><span>· v4.2</span></span>
     </span>
     <span class="hx-hero-tools">
      <button type="button" data-action="toggleTheme" class="hx-theme" aria-label="Switch light or dark">
       <svg fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path stroke-linecap="round" d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
       <span class="hx-theme-light">Light</span><span class="hx-theme-dark">Dark</span>
      </button>
     </span>
    </div>
    <div style="text-align:center;margin-top:6px">
     <div class="hx-eyebrow">Community Screening Companion</div>
     <div class="hx-id" style="font-size:36px;letter-spacing:-1px;margin:5px 0">Passport</div>
     <p style="margin:0;color:var(--hx-hero-sub);font-size:13.5px">Sign in with your staff credentials</p>
     <div style="margin-top:10px"><span class="hx-capsule"><i></i>Ready for Booth Check-in</span></div>
     <div class="hx-ruler"><span class="hx-ruler-pin" style="left:50%"></span></div>
    </div>
   </div>
  </section>

  <section class="hx-gate-card"><div id="authGateBody"></div></section>

  <div id="gateSandbox" class="hx-gate-sandbox">
   <button type="button" data-action="gateDemo" class="hx-gate-tile hx-gate-tile-mint">
    <span class="hx-gate-tile-head"><span>Practise<br>Sandbox</span>
     <span class="hx-gate-tile-ico"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/></svg></span></span>
    <span class="hx-gate-tile-sub">3 demo visitors loaded</span>
    <span class="hx-split"><span class="hx-split-label">3 demos</span><span class="hx-split-circle" aria-hidden="true">→</span></span>
   </button>
   <button type="button" data-action="gateDemo" class="hx-gate-tile hx-gate-tile-amber">
    <span class="hx-gate-tile-head"><span>Offline<br>Training</span>
     <span class="hx-gate-tile-ico"><svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg></span></span>
    <span class="hx-gate-tile-sub">Safe local sandbox</span>
    <span class="hx-split"><span class="hx-split-label">Start</span><span class="hx-split-circle" aria-hidden="true">→</span></span>
   </button>
  </div>
 </div>
</div>

<div id="printArea"></div>

<!-- ===== Toast ===== -->
<div id="toast" role="status" aria-live="polite" class="pointer-events-none fixed bottom-28 left-1/2 z-[60] -translate-x-1/2 translate-y-3 opacity-0 transition-all duration-300">
  <div class="flex items-center gap-2 rounded-2xl px-4 py-2.5 text-xs font-bold text-white"
       style="background:linear-gradient(135deg,rgba(31,77,72,.96),rgba(18,48,51,.96));box-shadow:0 18px 40px -18px rgba(16,60,58,.9);backdrop-filter:blur(12px)">
    <span class="h-2 w-2 rounded-full bg-brand-300"></span><span id="toastMsg"></span>
    <button id="toastUndo" class="hidden" style="pointer-events:auto;background:rgba(255,255,255,.15);border:0;border-radius:9999px;padding:4px 10px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#9fd8cc;cursor:pointer">Undo</button>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
