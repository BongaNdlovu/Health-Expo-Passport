<style>
  /* ============ BASE ============ */
  *{-webkit-tap-highlight-color:transparent}
  html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  body{

  /* ============ AMBIENT BACKGROUND ============ */
  .ambient{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .blob{position:absolute;border-radius:50%;opacity:.75}

  /* ============ GLASS SYSTEM ============ */
  .glass{
    background:linear-gradient(158deg,rgba(255,255,255,.82),rgba(255,255,255,.56));
    backdrop-filter:blur(20px) saturate(165%);

    border-radius:24px;

  /* ============ TYPE ============ */

  /* ============ CHIPS ============ */
  .chip{display:inline-flex;align-items:center;gap:.25rem;border-radius:9999px;padding:3px 9px;
        font-size:10px;line-height:1.2;font-weight:800;white-space:nowrap;letter-spacing:.01em;
        transition:background .3s,color .3s,border-color .3s}
  .chip-ok{background:rgba(58,165,151,.11);border:1px solid rgba(58,165,151,.22);color:#1f6b62}

  .chip-flag{background:rgba(217,105,92,.12);border:1px solid rgba(217,105,92,.25);color:#b04a42}
  .chip-none{background:rgba(18,48,51,.05);border:1px solid rgba(18,48,51,.07);color:#4f6870}

  /* ============ BUTTONS ============ */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;

       transition:transform .2s cubic-bezier(.22,1,.36,1),box-shadow .3s,background .3s,color .3s;
       will-change:transform}
  .btn:active{transform:scale(.965)}
  .btn-primary{background:linear-gradient(135deg,#46a597,#2b8074);color:#fff;

       backdrop-filter:blur(12px);box-shadow:0 8px 20px -16px rgba(16,60,58,.5),inset 0 1px 0 #fff}

  .btn-soft:hover{background:rgba(58,165,151,.16)}

  /* ============ FORM FIELDS ============ */
  .field{width:100%;border-radius:14px;border:1px solid rgba(18,48,51,.09);

         transition:border-color .25s,box-shadow .25s,background .25s}

  /* ============ NAV ============ */
  .nav-item{position:relative;flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:2px;
            padding:.45rem .1rem;border-radius:16px;border:0;background:transparent;cursor:pointer;

            transition:color .3s,background .35s cubic-bezier(.22,1,.36,1),transform .2s}

  .tile-l{display:block;font-size:9px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:#667d83}

  /* ============ HERO ============ */
  .hero{position:relative;overflow:hidden;border-radius:28px;

        box-shadow:0 24px 50px -30px rgba(16,60,58,.42),inset 0 1px 0 rgba(255,255,255,1)}

  /* ============ SIM PANEL ============ */
  .sim-panel{border-radius:22px;padding:1rem;

    box-shadow:inset 0 1px 0 rgba(255,255,255,1),0 14px 32px -26px rgba(16,60,58,.5)}

    background:linear-gradient(90deg,#25786e,#3aa597 55%,#7fd0c4);
    transition:width .6s cubic-bezier(.22,1,.36,1)}

  /* ============ STEPPER ============ */
  .step-btn{display:flex;align-items:center;justify-content:center;flex:none;
    height:40px;width:40px;border-radius:14px;border:1px solid rgba(18,48,51,.07);
    background:rgba(255,255,255,.8);color:#3d5c5e;font-size:18px;font-weight:700;cursor:pointer;
    transition:transform .18s cubic-bezier(.22,1,.36,1),background .25s,box-shadow .25s}

  .step-btn:active{transform:scale(.9);background:rgba(58,165,151,.12)}
  .step-input{width:100%;min-width:0;border-radius:14px;border:1px solid rgba(18,48,51,.08);
    background:rgba(255,255,255,.85);padding:.6rem .3rem;text-align:center;
    font-family:Inter,system-ui,sans-serif;font-variant-numeric:tabular-nums;font-size:15px;font-weight:700;color:#123033;
    transition:border-color .25s,box-shadow .25s,background .25s}
  .step-input:focus{outline:none;border-color:#5cc0b1;background:#fff;box-shadow:0 0 0 4px rgba(92,192,177,.16)}

  /* ============ ANIMATIONS ============ */
  @keyframes rise{from{opacity:0;transform:translateY(16px) scale(.985)}to{opacity:1;transform:none}}
  .stagger>*{animation:rise .58s cubic-bezier(.22,1,.36,1) both}
  .stagger>*:nth-child(1){animation-delay:.01s}
  .stagger>*:nth-child(2){animation-delay:.06s}
  .stagger>*:nth-child(3){animation-delay:.11s}
  .stagger>*:nth-child(4){animation-delay:.16s}
  .stagger>*:nth-child(5){animation-delay:.21s}
  .stagger>*:nth-child(6){animation-delay:.26s}
  .stagger>*:nth-child(7){animation-delay:.31s}
  .stagger>*:nth-child(8){animation-delay:.36s}
  .stagger>*:nth-child(9){animation-delay:.41s}

  @keyframes popIn{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
  .pop-in{animation:popIn .34s cubic-bezier(.34,1.4,.64,1) both}

  @keyframes fadeIn{from{opacity:0}to{opacity:1}}
  .fade-in{animation:fadeIn .3s ease both}

  @keyframes sheetUp{from{opacity:0;transform:translateY(28px) scale(.985)}to{opacity:1;transform:none}}
  .sheet-up{animation:sheetUp .42s cubic-bezier(.22,1,.36,1) both}

  @keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
  .modal-in{animation:modalIn .38s cubic-bezier(.22,1,.36,1) both}


  @keyframes pulseDot{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
  .pulse-dot{animation:pulseDot 1.8s ease-in-out infinite}


  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;
      transition-duration:.001ms!important}
    .blob{animation:none}
  }

  #printArea{display:none}

  @media print{

  /* ---- phone / installed-app behaviour ---- */
  /* iOS Safari zooms the whole page when a field smaller than 16px is tapped; on touch screens keep them at 16px */
  @media (pointer:coarse){.field,.step-input,select.field,textarea.field{font-size:16px}}
  /* a downward swipe at the top must not reload the page and throw away a half-filled form */

  /* ============ LIVE QUEUE ============ */
  .q-state{display:flex;align-items:center;gap:.5rem;border-radius:16px;padding:.55rem .75rem;font-size:11px;font-weight:700;line-height:1.35}
  .q-state-live{background:rgba(58,165,151,.11);color:#1f6b62}
  .q-state-warn{background:rgba(231,184,79,.17);color:#7a5012}
  .q-state-bad{background:rgba(217,105,92,.12);color:#a4483f}
  .q-state-info{background:rgba(18,48,51,.06);color:#436063}
  .q-dot{width:9px;height:9px;flex:none;border-radius:50%;background:currentColor}
  .q-state-live .q-dot{animation:qpulse 1.8s ease-in-out infinite}
  @keyframes qpulse{0%,100%{box-shadow:0 0 0 0 rgba(47,158,111,.5)}50%{box-shadow:0 0 0 5px rgba(47,158,111,0)}}
  .q-totals{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.4rem;margin-top:.7rem}
  .q-total{border-radius:16px;background:rgba(18,48,51,.045);padding:.55rem .25rem;text-align:center}
  .q-total b{display:block;font-family:'Plus Jakarta Sans',Inter,sans-serif;font-size:1.25rem;line-height:1;font-weight:800;color:#0f2a2c}
  .q-total span{display:block;margin-top:.3rem;font-size:9.5px;font-weight:700;color:#5c747a}
  .q-board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.55rem}
  .q-card{position:relative;text-align:left;border-radius:20px;padding:.8rem .8rem .75rem;border:1.5px solid transparent;
          background:linear-gradient(160deg,rgba(255,255,255,.86),rgba(255,255,255,.55));box-shadow:0 10px 24px -18px rgba(16,60,58,.5);
          transition:transform .2s,border-color .2s,box-shadow .2s}
  .q-card{display:block;width:100%;cursor:pointer}
  .q-card-n,.q-card-line{display:block}
  .q-card:active{transform:scale(.975)}
  .q-card-sel{border-color:var(--qc,#46a597);box-shadow:0 14px 28px -16px var(--qc,#46a597)}
  .q-card-ok{--qc:#2f9e6f}.q-card-watch{--qc:#d9a23c}.q-card-flag{--qc:#d6584a}
  .q-card-top{display:flex;align-items:center;justify-content:space-between;gap:.4rem}
  .q-card-name{font-size:11px;font-weight:800;color:#33504f;line-height:1.2}
  .q-card-dot{width:10px;height:10px;flex:none;border-radius:50%;background:var(--qc)}
  .q-card-n{margin-top:.5rem;font-family:'Plus Jakarta Sans',Inter,sans-serif;font-size:2rem;line-height:1;font-weight:800;color:#0f2a2c}
  .q-card-n small{margin-left:.3rem;font-family:Inter,system-ui,sans-serif;font-size:10px;font-weight:700;color:#4f6870}
  .q-card-line{margin-top:.35rem;font-size:10px;font-weight:600;color:#5c747a;line-height:1.35}
  .q-card-line b{color:#123033}
  .q-head{display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem}
  .q-actions{display:grid;grid-template-columns:1.4fr 1fr;gap:.5rem;margin-top:.8rem}
  .q-actions .btn{padding:.8rem .5rem;font-size:12px}
  .q-actions .btn[disabled],.q-mini[disabled]{opacity:.45;pointer-events:none}
  .q-label{margin:1rem .15rem .45rem;font-size:10.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#5c747a}
  .q-row{display:flex;align-items:center;gap:.6rem;border-radius:18px;padding:.55rem .6rem;background:rgba(255,255,255,.62);border:1px solid rgba(255,255,255,.9)}
  .q-row+.q-row{margin-top:.4rem}
  .q-row-serving{background:linear-gradient(160deg,rgba(220,243,238,.9),rgba(255,255,255,.7));border-color:rgba(58,165,151,.28)}
  .q-pos{display:flex;width:28px;height:28px;flex:none;align-items:center;justify-content:center;border-radius:10px;font-size:12px;font-weight:800;background:rgba(18,48,51,.07);color:#33504f}
  .q-who{min-width:0;flex:1}
  .q-who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:700;color:#123033}
  .q-who span{display:block;font-size:10px;font-weight:600;color:#4f6870}
  .q-late{color:#b04a42!important;font-weight:800!important}
  .q-slow{color:#8f5f14!important;font-weight:800!important}
  .q-btns{display:flex;flex:none;gap:.3rem}
  .q-mini{min-width:36px;height:36px;border-radius:12px;padding:0 .6rem;font-size:11px;font-weight:800;border:0;cursor:pointer;
          display:inline-flex;align-items:center;justify-content:center;transition:transform .15s,background .2s}
  .q-mini:active{transform:scale(.93)}
  .q-mini-go{background:linear-gradient(135deg,#46a597,#2b8074);color:#fff}
  .q-mini-soft{background:rgba(58,165,151,.12);color:#1f6b62}
  .q-mini-x{background:rgba(18,48,51,.06);color:#4f6870}
  .q-mini-x.q-sure{background:#d6584a;color:#fff}
  .q-empty{padding:.9rem .5rem;text-align:center;font-size:11px;font-weight:600;color:#4f6870}
  .q-pick{display:flex;width:100%;align-items:center;gap:.7rem;border-radius:18px;padding:.55rem .6rem;text-align:left}
  .q-pick:hover{background:rgba(255,255,255,.6)}
  .q-pick[disabled]{opacity:.6;cursor:default}
  .q-note{margin-top:.7rem;font-size:10.5px;line-height:1.45;color:#4f6870}
  .q-tvbtn{flex:none;padding:.5rem .8rem;font-size:11px;border-radius:14px}

  /* ============ BIG SCREEN (TV / projector) — sizes follow the screen, not the phone ============ */
  .q-tv{position:fixed;inset:0;z-index:70;display:flex;flex-direction:column;gap:2vmin;padding:2.4vmin 2.8vmin;overflow:hidden;color:#eaf6f3;
        background:radial-gradient(120% 90% at 15% 0%,#175052 0%,#0d2426 55%,#08171a 100%)}

  .q-tv-top{display:flex;align-items:center;justify-content:space-between;gap:2vmin}

  .q-tv-ok{--qc:#4cc38a}.q-tv-watch{--qc:#f0b84a}.q-tv-flag{--qc:#f0766a}
  .q-tv-name{font-family:'Plus Jakarta Sans',Inter,sans-serif;font-weight:800;font-size:clamp(14px,2.7vmin,36px);line-height:1.15}
  .q-tv-lab{margin-top:1.6vmin;font-size:clamp(9px,1.45vmin,19px);font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--qc)}
  .q-tv-now{font-family:'Plus Jakarta Sans',Inter,sans-serif;font-weight:800;font-size:clamp(22px,6.4vmin,86px);line-height:1.05;letter-spacing:-.01em;font-variant-numeric:tabular-nums}

  .vw-sw{flex:none;border-radius:9999px;padding:.35rem .75rem;background:#fff;font-size:11.5px;font-weight:800;color:#8f5420}

  /* ============ VISITOR JOURNEY frame ============ */
  .jr{margin-bottom:.9rem;border-radius:22px;padding:.7rem;background:linear-gradient(160deg,rgba(255,255,255,.88),rgba(255,255,255,.6));
      border:1px solid #fff;box-shadow:0 12px 28px -22px rgba(16,60,58,.5)}
  .jr-who{display:flex;width:100%;align-items:center;gap:.65rem;border:0;background:none;padding:.15rem .2rem .55rem;text-align:left;cursor:pointer}
  .jr-av{display:flex;flex:none;width:36px;height:36px;align-items:center;justify-content:center;border-radius:13px;font-size:12px;font-weight:800}
  .jr-name{min-width:0;flex:1}
  .jr-name b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px;font-weight:800;color:#0f2a2c}
  .jr-name>span{display:block;font-size:10.5px;font-weight:600;color:#4f6870}
  .jr-name em{font-style:normal;font-weight:800;color:#b04a42}
  .jr-change{flex:none;border-radius:9999px;padding:.3rem .7rem;font-size:10.5px;font-weight:800;color:#1f6b62;background:rgba(58,165,151,.12)}
  .jr-steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;list-style:none;margin:0;padding:0}
  .jr-step{display:flex;width:100%;flex-direction:column;align-items:center;gap:3px;border:0;border-radius:14px;padding:.45rem .1rem;
           background:rgba(18,48,51,.04);cursor:pointer;color:#4f6870;transition:background .2s,color .2s}
  .jr-dot{display:flex;width:22px;height:22px;align-items:center;justify-content:center;border-radius:50%;font-size:11px;font-weight:800;
          background:rgba(18,48,51,.08);color:#5c747a}
  .jr-lbl{font-size:10.5px;font-weight:800;line-height:1.1;text-align:center}
  .jr-lbl small{display:block;font-size:9px;font-weight:700;opacity:.8}
  .jr-step.is-past .jr-dot{background:rgba(58,165,151,.2);color:#1f6b62}
  .jr-step.is-on{background:linear-gradient(135deg,#46a597,#2b8074);color:#fff;box-shadow:0 10px 20px -12px rgba(37,120,110,.8)}
  .jr-step.is-on .jr-dot{background:rgba(255,255,255,.25);color:#fff}
  /* Back / Next stay in reach above the tab bar, however long the step is */
  .jr-foot{position:sticky;bottom:calc(var(--navh,84px) + 4px);z-index:20;margin-top:1rem;border-radius:22px;padding:.55rem;
           background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
           border:1px solid rgba(255,255,255,.95);box-shadow:0 10px 28px -16px rgba(16,60,58,.45)}
  .lite .jr-foot{background:rgba(255,255,255,.97);backdrop-filter:none;-webkit-backdrop-filter:none}
  .st-one .step-input{min-height:58px;font-size:24px}
  .st-one .step-btn{width:58px;height:58px;font-size:24px}
  .tap-link{display:inline-flex;align-items:center;min-height:44px;padding:0 .2rem;border:0;background:none;cursor:pointer;
            font-size:12px;font-weight:800;color:#1f6b62;white-space:nowrap}
  .pf .btn[disabled]{opacity:.45;pointer-events:none}
  .jr-note{margin:.1rem .25rem .5rem;font-size:11px;font-weight:600;color:#7a5012;text-align:center}
  .jr-btns{display:grid;grid-template-columns:1fr 1.6fr;gap:.5rem}
  .jr-btns .btn{padding:.85rem .5rem;font-size:12.5px}
  .snd-list{display:grid;gap:.55rem}
  .snd-item{display:flex;width:100%;align-items:center;gap:.8rem;border-radius:20px;padding:.9rem 1rem;text-align:left;cursor:pointer;
            border:1px solid #fff;background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(255,255,255,.62));box-shadow:0 12px 26px -22px rgba(16,60,58,.5)}
  .snd-item b{display:block;font-size:13px;color:#0f2a2c}
  .snd-item span span{display:block;margin-top:2px;font-size:11px;color:#5c747a}
  .snd-ic{flex:none;font-size:22px;line-height:1}
  .snd-go{flex:none;font-size:15px;font-weight:800;color:#2b8074}
  .snd-item.is-on{border-color:rgba(58,165,151,.35);background:linear-gradient(160deg,rgba(220,243,238,.95),rgba(255,255,255,.7))}

  /* ============ PLAN: what to do, why and how ============ */
  .pl-problem{margin-top:.55rem;font-size:13.5px;font-weight:700;line-height:1.4;color:#123033}
  .pl-also{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:.7rem;font-size:10.5px;font-weight:700;color:#5c747a}
  .pl-also .fd-chip{padding:.4rem .7rem}
  .pl-switch{margin-top:.75rem}
  .pl-switch summary,.pl-det summary{cursor:pointer;list-style:none}
  .pl-switch summary::-webkit-details-marker,.pl-det summary::-webkit-details-marker{display:none}
  .pl-switch summary{display:inline-block;font-size:11px;font-weight:800;color:#2b8074}
  .pl-urgent{display:grid;gap:.25rem;border-radius:20px;padding:.85rem 1rem;font-size:11.5px;line-height:1.45;
             background:rgba(217,105,92,.12);border:1px solid rgba(217,105,92,.3);color:#a4483f}
  .pl-urgent b{font-size:13px}
  .pl-h{margin:0 .25rem .55rem;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#5c747a}
  .ac-list{list-style:none;margin:0;padding:0;display:grid;gap:.65rem}
  .ac-card{border-radius:22px;padding:1rem 1rem .95rem;border:1px solid #fff;
           background:linear-gradient(160deg,rgba(255,255,255,.92),rgba(255,255,255,.64));box-shadow:0 14px 30px -22px rgba(16,60,58,.55)}
  .ac-top{display:flex;align-items:flex-start;gap:.7rem}
  .ac-n{display:flex;flex:none;width:30px;height:30px;align-items:center;justify-content:center;border-radius:50%;
        font-size:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,var(--s1),var(--s2))}
  .ac-do{padding-top:3px;font-family:'Plus Jakarta Sans',Inter,sans-serif;font-size:15.5px;font-weight:800;line-height:1.3;color:#0f2a2c}
  .ac-why,.ac-how{margin-top:.6rem;font-size:12.5px;line-height:1.5;color:#3d5c5e}
  .ac-why b,.ac-how b{display:inline-block;margin-right:.4rem;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
  .ac-how ul{margin:.2rem 0 0;padding-left:1.15rem;list-style:disc}
  .ac-how li+li{margin-top:.15rem}
  .ac-ref{font-size:9.5px;font-weight:700;color:#5f7479;white-space:nowrap}
  .ac-cost{display:inline-block;margin-top:.65rem;border-radius:9999px;padding:2px 10px;font-size:10.5px;font-weight:800;
           background:rgba(231,184,79,.18);color:#7a5012}
  .pl-more{list-style:none;margin:.55rem 0 0;padding:0;display:grid;gap:.6rem}
  .pl-more li{font-size:12.5px;line-height:1.4;color:#123033}
  .pl-more li>span:last-child{display:block;margin-top:2px;font-size:11.5px;color:#5c747a}
  .pl-row{display:flex;align-items:flex-start;gap:.65rem}
  .pl-row+.pl-row{margin-top:.75rem}
  .pl-ic{flex:none;font-size:18px;line-height:1.25}
  .pl-row b{display:block;font-size:12.5px;color:#123033}
  .pl-row>div>span{display:block;margin-top:2px;font-size:11.5px;line-height:1.45;color:#3d5c5e}
  .pl-food{display:flex;width:100%;align-items:center;gap:.75rem;border:0;border-radius:20px;padding:.9rem 1rem;text-align:left;cursor:pointer;color:#fff;
           background:linear-gradient(135deg,#3a9487,#2a7a70);box-shadow:0 18px 36px -24px rgba(31,77,72,.95)}
  .pl-food b{display:block;font-size:12.5px}
  .pl-food span span{display:block;margin-top:2px;font-size:10.5px;opacity:.8}
  .pl-det summary{display:flex;align-items:center;justify-content:space-between;padding:.95rem 1rem;font-size:12.5px;font-weight:800;color:#123033}
  .pl-det summary::after{content:'▾';color:#5f7479}
  .pl-det[open] summary::after{content:'▴'}
  .pl-det>div{padding:0 1rem 1rem}

  /* ============ FOOD SCREEN (opened from the Plan tab) ============ */
  .fd-chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .fd-chips::-webkit-scrollbar{display:none}
  .fd-chip{flex:none;border-radius:9999px;padding:.5rem .85rem;font-size:11px;font-weight:800;cursor:pointer;
           border:1px solid rgba(18,48,51,.08);background:rgba(255,255,255,.72);color:#436063;transition:background .2s,color .2s}
  .fd-chip[aria-pressed="true"]{background:linear-gradient(135deg,var(--s1,#46a597),var(--s2,#2b8074));color:#fff;border-color:transparent}
  .fd-seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:4px;border-radius:9999px;background:rgba(18,48,51,.06)}
  .fd-seg button{border:0;border-radius:9999px;padding:.55rem .2rem;font-size:11px;font-weight:800;color:#5b7178;background:transparent;cursor:pointer}
  .fd-seg button[aria-pressed="true"]{background:#fff;color:#1f6b62;box-shadow:0 1px 3px rgba(16,60,58,.12)}
  .fd-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.4rem}
  .fd-tile{border-radius:16px;background:rgba(18,48,51,.045);padding:.55rem .4rem;text-align:center;min-width:0}
  .fd-tile b{display:block;font-family:'Plus Jakarta Sans',Inter,sans-serif;font-size:1.05rem;line-height:1.1;font-weight:800;color:#0f2a2c;
             font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fd-tile span{display:block;margin-top:.3rem;font-size:9.5px;font-weight:700;color:#5c747a}
  .fd-list{list-style:none;margin:0;padding:0}
  .fd-row+.fd-row{border-top:1px solid rgba(18,48,51,.06)}
  .fd-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:.35rem .75rem;align-items:end;width:100%;padding:.75rem .1rem .7rem;
           text-align:left;background:none;border:0;cursor:pointer;color:inherit}
  .fd-name{min-width:0;font-size:12.5px;font-weight:800;color:#123033;line-height:1.25}
  .fd-name small{display:block;margin-top:2px;font-size:10px;font-weight:600;color:#4f6870}
  .fd-val{font-variant-numeric:tabular-nums;font-size:13.5px;font-weight:800;color:#123033;white-space:nowrap}
  .fd-val small{display:block;text-align:right;font-size:9px;font-weight:700;color:#9db0b4}
  .fd-track{grid-column:1/-1;display:block;height:12px;border-radius:9999px;background:rgba(18,48,51,.06);overflow:hidden}
  .fd-bar{display:block;height:100%;width:calc(var(--w) * 100%);min-width:6px;border-radius:9999px;
          background:linear-gradient(90deg,var(--s1,#46a597),var(--s2,#2b8074))}
  /* bars grow in when the screen opens or the view changes — not on every redraw */
  .fd-anim .fd-bar{transform-origin:left center;animation:fdgrow .5s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--d,0) * 60ms)}
  @keyframes fdgrow{from{transform:scaleX(0)}}
  @media (prefers-reduced-motion:reduce){.fd-anim .fd-bar{animation:none}}
  .lite .fd-anim .fd-bar{animation:none}
  .fd-trio{grid-column:1/-1;display:grid;gap:5px}
  .fd-part{display:block;margin-top:2px;font-size:10px;font-weight:800;color:#5c747a}
  .fd-mini{display:grid;grid-template-columns:7.9rem minmax(0,1fr) 4rem;align-items:center;gap:.5rem;font-size:10px;font-weight:700;color:#5c747a}
  .fd-mini>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .fd-mini .fd-track{grid-column:auto;height:8px}
  .fd-mini b{text-align:right;font-variant-numeric:tabular-nums;color:#123033;white-space:nowrap}
  .fd-lo .fd-bar{background:linear-gradient(90deg,#6fcf9a,#2f9e6f)}
  .fd-hi .fd-bar{background:linear-gradient(90deg,#f0a39a,#d6584a)}
  .fd-one{grid-column:1/-1;display:block;font-size:10.5px;font-weight:600;color:#5c747a}
  .fd-more{font-size:10px;font-weight:800;color:#2b8074}
  .fd-head[aria-expanded="true"] .fd-more{color:#4f6870}
  .fd-detail{padding:0 .1rem .9rem}
  .fd-h{margin:.2rem 0 .45rem;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#5c747a}
  .fd-why{display:flex;align-items:flex-start;gap:.5rem;font-size:11.5px;line-height:1.45;color:#3d5c5e}
  .fd-why+.fd-why{margin-top:.5rem}
  .fd-tag{flex:none;margin-top:1px;border-radius:9999px;padding:1px 8px;font-size:9.5px;font-weight:800;
          background:linear-gradient(150deg,var(--t1),var(--t2));color:var(--ink)}
  .fd-ref{font-size:9.5px;font-weight:700;color:#5f7479;white-space:nowrap}
  .fd-care{margin-top:.6rem;border-radius:12px;padding:.55rem .7rem;background:rgba(231,184,79,.16);color:#7a5012;font-size:11px;font-weight:600;line-height:1.45}
  .fd-money{margin-top:.6rem;border-radius:12px;padding:.55rem .7rem;background:rgba(18,48,51,.045);font-size:10.5px;line-height:1.55;color:#436063}
  .fd-money b{color:#123033}
  .fd-foot{margin-top:.8rem;font-size:10px;line-height:1.5;color:#5f7479}
  .fd-pouch{display:flex;align-items:center;gap:.75rem;border-radius:20px;padding:.85rem 1rem;color:#fff;
            background:linear-gradient(135deg,#3a9487,#2a7a70);box-shadow:0 18px 36px -24px rgba(31,77,72,.95)}
  .fd-pouch b{display:block;font-size:12px}
  .fd-pouch span{display:block;margin-top:2px;font-size:10.5px;line-height:1.4;opacity:.8}

  /* ============ READABILITY: phones in sunlight, older eyes ============
     No word smaller than about 11px, grey text at least 4.5:1 against the page, and anything tappable at least
     ~40–44px tall. Done as overrides so every screen gets it without renaming classes. */
  #main .text-\[9px\],[role=dialog] .text-\[9px\]{font-size:10.5px}
  #main .text-\[10px\],[role=dialog] .text-\[10px\]{font-size:11px}
  .text-\[\#6b8187\],.text-\[\#667d83\],.text-\[\#6b8189\]{color:#4f6870}
  .text-\[\#8a9aa0\],.text-\[\#9db0b4\]{color:#5f7479}
  .ac-ref,.fd-ref{font-size:10.5px}
  .q-card-line,.q-who span,.fd-name small,.fd-mini,.fd-part{font-size:11px}
  .q-total span,.fd-tile span,.fd-val small,.jr-lbl small{font-size:10.5px}
  .availpill{min-height:44px;font-size:12px}
  .fd-chip,.pl-also .fd-chip{min-height:40px}
  .pl-switch summary{display:inline-flex;align-items:center;min-height:44px}
  .q-mini{min-width:40px;height:40px}
  .q-tvbtn{min-height:40px}
  .btn{min-height:40px}
  .chip,.servechip,.tile-l,.q-card-n small,.ac-why b,.ac-how b{font-size:10.5px}
  .pl-switch summary{color:#1f6b62}
  .text-rose-600{color:#a8433a}

  /* ============ SPACING: nothing squashed on a phone ============ */
  .tile-v{margin-top:5px}
  .tile{padding:.6rem .7rem}
  .fd-chips{flex-wrap:wrap;overflow:visible}                 /* wrap: every plan / station visible, none hidden off the edge */
  .st-grid{display:grid;grid-template-columns:minmax(0,1fr);gap:.75rem}
  @media (min-width:560px){.st-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .st-grid .step-input{min-height:48px;font-size:19px}
  .st-grid .step-btn{width:48px;height:48px}
  .pl-more{gap:.9rem}
  .pl-more li>span:last-child{margin-top:3px}
  @media (max-width:399px){.q-totals{grid-template-columns:repeat(2,minmax(0,1fr))}}
  .q-total{padding:.65rem .4rem}
  .jr-steps{gap:6px}
  .vw-bar{gap:.75rem}
  #headerChip,#headerChip span{white-space:nowrap}
  /* Team's four sub-tabs always fit side by side: nothing scrolls off the edge */
  .vt-tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
  /* blood pressure: label column on the left, the − / value / + control takes the rest of the width */
  .st-bp{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:.7rem .9rem}
  .st-bp .microlabel{margin:0}
  .st-bp .st-warn{grid-column:1/-1;margin-top:-.3rem}
  .st-bp .step-input{min-height:48px;font-size:19px}
  .st-bp .step-btn{width:48px;height:48px}            /* "EXPO-042" never breaks across two lines */

</style>
</head>
<body>
<!-- intro: the app's logo, shown from the very first paint (before any script runs); the script below lets it go -->
<div id="intro" aria-hidden="true"><div class="intro-badge"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12zM7.5 12h2.25l1.5-3 2 5 1.5-2h2.25"/></svg></div></div>

<!-- ambient light field -->
<div class="ambient" aria-hidden="true">
  <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span><span class="blob b4"></span><span class="blob b5"></span>
</div>

<div id="app" class="relative z-10 mx-auto flex w-full max-w-md flex-col" style="min-height:100vh;min-height:100dvh">

  <!-- ===== Header ===== -->
  <!-- the top padding keeps the header clear of the phone's status bar: Capacitor's measured size in the app, env() in browsers -->
  <header class="sticky top-0 z-30 px-3" style="padding-top:max(.75rem,calc(var(--safe-area-inset-top,0px) + .5rem),calc(env(safe-area-inset-top,0px) + .5rem))">
    <div class="glass flex items-center justify-between gap-2 rounded-[22px] px-3 py-2.5">
      <div class="hdr-brand flex items-center gap-2.5">
        <button id="cloudBtn" data-action="openCloud" aria-label="Cloud sync status" title="Cloud sync"
             class="relative flex h-9 w-9 flex-none items-center justify-center rounded-[14px] text-white"
             style="background:linear-gradient(135deg,#58b5a7,#2f8b7f);box-shadow:0 8px 18px -10px rgba(37,120,110,.9),inset 0 1px 0 rgba(255,255,255,.35)">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12zM7.5 12h2.25l1.5-3 2 5 1.5-2h2.25"/></svg>
          <span id="cloudDot" style="position:absolute;right:-3px;top:-3px;width:11px;height:11px;border-radius:9999px;background:#9db0b4;border:2px solid #fff"></span>
        </button>
        <div class="hdr-title leading-tight" style="white-space:nowrap">
          <div class="display text-[15px] font-extrabold tracking-tight text-[#123033]">Health Expo Passport</div>
        </div>
      </div>
      <div class="hdr-tools flex items-center gap-2">
        <button id="notifBell" data-action="openNotifs" aria-label="Notifications" title="Notifications"
          class="btn btn-glass relative hidden h-9 w-9 flex-none items-center justify-center rounded-[14px]">
          <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.857 17.082a23.848 23.848 0 005.454-1.31A8.967 8.967 0 0118 9.75v-.7V9A6 6 0 006 9v.75a8.967 8.967 0 01-2.312 6.022c1.733.64 3.56 1.085 5.455 1.31m5.714 0a24.255 24.255 0 01-5.714 0m5.714 0a3 3 0 11-5.714 0"/></svg>
          <span id="notifDot" style="display:none;position:absolute;right:-4px;top:-4px;min-width:17px;height:17px;padding:0 4px;border-radius:9999px;background:#d88a55;border:2px solid #fff;color:#fff;font-size:9px;font-weight:800;line-height:13px;text-align:center"></span>
        </button>
        <button id="headerChip" data-action="switcher-open" aria-label="Switch visitor or volunteer"
          class="btn btn-glass h-9 gap-1.5 rounded-full py-0 pl-1 pr-2.5"></button>
      </div>
    </div>
  </header>

  <main id="main" class="flex-1 px-3 pb-4 pt-3"></main>

  <!-- ===== Floating glass nav ===== -->
  <nav class="sticky bottom-0 z-30 px-3 pb-3 pt-1" style="padding-bottom:max(.75rem,calc(var(--safe-area-inset-bottom,0px) + .5rem),calc(env(safe-area-inset-bottom,0px) + .5rem))">
    <div id="navBar" class="glass relative rounded-[24px] p-1.5"><span class="nav-goo" aria-hidden="true"><span id="navPill" class="nav-pill"></span></span><div id="navItems" class="relative flex items-stretch gap-1"></div></div>
  </nav>
</div>

<!-- ===== Attendee switcher ===== -->
<div id="switcherModal" role="dialog" aria-modal="true" class="fixed inset-0 z-50 hidden items-end bg-[#0b1a1c]/40 backdrop-blur-md" data-action="closeSwitcher" data-backdrop="1">
  <div class="glass sheet-up mx-auto w-full max-w-md rounded-b-none rounded-t-[28px] p-5">
    <div class="mx-auto mb-4 h-1.5 w-10 rounded-full bg-[#123033]/10"></div>
    <div id="switcherHead"></div>
    <div id="switcherList" class="mt-3 max-h-[52vh] space-y-1.5 overflow-y-auto no-scrollbar"></div>
    <div id="switcherFoot" class="mt-3"></div>
  </div>
</div>

<!-- ===== Live queue: big screen (TV / projector). Badge numbers only — never names. ===== -->
<div id="tv" class="q-tv hidden" role="dialog" aria-modal="true" aria-label="Queue board">
  <div class="q-tv-top">
    <div><div class="q-tv-title">Health Expo · Queue</div><div id="tvState" class="q-tv-sub info"></div></div>
    <div class="q-tv-right"><span id="tvClock" class="q-tv-clock"></span>
      <button class="q-tv-x" data-action="closeBigScreen" aria-label="Close big screen">✕</button></div>
  </div>
  <div id="tvGrid" class="q-tv-grid"></div>
</div>

<!-- ===== Live queue: add a visitor to a station's line ===== -->
<div id="queueModal" role="dialog" aria-modal="true" aria-label="Add a visitor to the queue" class="fixed inset-0 z-50 hidden items-end bg-[#0b1a1c]/40 backdrop-blur-md" data-action="closeQueuePick" data-backdrop="1">
  <div class="glass sheet-up mx-auto w-full max-w-md rounded-b-none rounded-t-[28px] p-5">
    <div class="mx-auto mb-4 h-1.5 w-10 rounded-full bg-[#123033]/10"></div>
    <div id="queueHead"></div>
    <div id="queueList" class="mt-3 max-h-[52vh] space-y-1 overflow-y-auto no-scrollbar"></div>
    <button data-action="closeQueuePick" class="btn btn-glass mt-3 w-full py-2.5 text-xs">Done</button>
  </div>
</div>

<!-- ===== Notifications hub (the bell) ===== -->
<div id="notifSheet" role="dialog" aria-modal="true" aria-label="Notifications" class="fixed inset-0 z-50 hidden items-end bg-[#0b1a1c]/40 backdrop-blur-md" data-action="notif-close" data-backdrop="1">
  <div class="glass sheet-up mx-auto w-full max-w-md rounded-b-none rounded-t-[28px] p-5">
    <div class="mx-auto mb-4 h-1.5 w-10 rounded-full bg-[#123033]/10"></div>
    <div id="notifBody" class="max-h-[52vh] overflow-y-auto no-scrollbar"></div>
    <button data-action="notif-close" class="btn btn-glass mt-3 w-full py-2.5 text-xs">Close</button>
  </div>
</div>

<!-- ===== Placement board: move, swap, release, make team leader (admins and station leaders) ===== -->
<div id="placeSheet" role="dialog" aria-modal="true" aria-label="Place volunteer" class="fixed inset-0 z-50 hidden items-end bg-[#0b1a1c]/40 backdrop-blur-md" data-action="place-close" data-backdrop="1">
  <div class="glass sheet-up mx-auto w-full max-w-md rounded-b-none rounded-t-[28px] p-5">
    <div class="mx-auto mb-4 h-1.5 w-10 rounded-full bg-[#123033]/10"></div>
    <div id="placeBody" class="max-h-[52vh] overflow-y-auto no-scrollbar"></div>
    <button data-action="place-close" class="btn btn-glass mt-3 w-full py-2.5 text-xs">Done</button>
  </div>
</div>

<!-- ===== Cloud sync / staff sign-in ===== -->
<div id="cloudModal" role="dialog" aria-modal="true" aria-label="Cloud sync" class="fixed inset-0 z-50 hidden items-end bg-[#0b1a1c]/40 backdrop-blur-md" data-action="closeCloud" data-backdrop="1">
  <div class="glass sheet-up mx-auto w-full max-w-md rounded-b-none rounded-t-[28px] p-5">
    <div class="mx-auto mb-4 h-1.5 w-10 rounded-full bg-[#123033]/10"></div>
    <div id="cloudBody"></div>
  </div>
</div>

<!-- ===== Account hub: my details, my church's members, every church for the platform admin ===== -->
<div id="acctSheet" role="dialog" aria-modal="true" aria-label="Account hub" class="fixed inset-0 hidden items-end bg-[#0b1a1c]/40 backdrop-blur-md" style="z-index:70" data-action="closeAcct" data-backdrop="1">
  <div class="glass sheet-up mx-auto flex max-h-[92vh] w-full max-w-md flex-col rounded-b-none rounded-t-[28px] p-5">
    <div class="mx-auto mb-4 h-1.5 w-10 rounded-full bg-[#123033]/10"></div>
    <div id="acctTabs"></div>
    <div id="acctBody" class="mt-3 flex-1 overflow-y-auto no-scrollbar"></div>
    <button data-action="closeAcct" class="btn btn-glass mt-3 w-full py-2.5 text-xs">Close</button>
  </div>
</div>

<!-- ===== Incoming expo / volunteer pledge ===== -->
<div id="volModal" role="dialog" aria-modal="true" class="fixed inset-0 z-50 hidden items-center justify-center bg-[#0b1a1c]/50 p-4 backdrop-blur-md" data-action="closeVolModal" data-backdrop="1">
  <div class="glass modal-in flex max-h-[92vh] w-full max-w-md flex-col overflow-hidden rounded-[28px]">
    <div class="flex items-center justify-between px-5 py-3.5 text-white"
         style="background:linear-gradient(135deg,#d89455,#b86f30)">
      <div class="flex items-center gap-3">
        <div class="flex h-9 w-9 items-center justify-center rounded-full bg-white/20 text-xs font-extrabold backdrop-blur">EX</div>
        <div>
          <div id="volModalTitle" class="text-sm font-bold">Incoming Health Expo</div>
          <div id="volModalSub" class="text-[10px] text-white/80">Pledge your help</div>
        </div>
      </div>
      <button data-action="closeVolModal" aria-label="Close" class="text-white/70 transition hover:text-white">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="volBody" class="flex-1 space-y-3 overflow-y-auto bg-white/40 p-4"></div>
    <div class="flex gap-2 border-t border-white/60 bg-white/50 p-3 backdrop-blur">
      <button data-action="vol-modal-team" class="btn btn-glass flex-1 py-2.5 text-[11px] text-[#5b7178]">See the team</button>
      <button data-action="vol-modal-new" class="btn flex-1 py-2.5 text-[11px] text-white"
        style="background:linear-gradient(135deg,#d89455,#b86f30);box-shadow:0 12px 24px -14px rgba(184,111,48,.9)">Pledge to help →</button>
    </div>
  </div>
</div>

<!-- ===== WhatsApp report ===== -->
<div id="waModal" role="dialog" aria-modal="true" class="fixed inset-0 z-50 hidden items-center justify-center bg-[#0b1a1c]/50 p-4 backdrop-blur-md" data-action="closeWhatsApp" data-backdrop="1">
  <div class="glass modal-in flex max-h-[92vh] w-full max-w-md flex-col overflow-hidden rounded-[28px]">
    <div class="flex items-center justify-between px-5 py-3.5 text-white"
         style="background:linear-gradient(135deg,#58b5a7,#2f8b7f)">
      <div class="flex items-center gap-3">
        <div class="flex h-9 w-9 items-center justify-center rounded-full bg-white/20 text-xs font-extrabold backdrop-blur">NS</div>
        <div>
          <div class="text-sm font-bold">Health Expo Team</div>
          <div class="text-[10px] text-white/75" id="waSub">Message preview · opens in WhatsApp</div>
        </div>
      </div>
      <button data-action="closeWhatsApp" aria-label="Close" class="text-white/70 transition hover:text-white">
        <svg class="h-5 w-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div id="waBody" class="flex-1 space-y-3 overflow-y-auto bg-white/40 p-4"></div>
    <div id="waFoot" class="flex gap-2 border-t border-white/60 bg-white/50 p-3 backdrop-blur">
      <button data-action="recycleBadge" class="btn btn-glass flex-1 py-2.5 text-[11px] text-[#5b7178]">Recycle badge</button>
      <button data-action="sendWhatsApp"
        class="btn flex-1 py-2.5 text-[11px] text-white"
        style="background:linear-gradient(135deg,#25D366,#1aa851);box-shadow:0 12px 24px -14px rgba(37,211,102,.9)">Send in WhatsApp →</button>
    </div>
  </div>
</div>

<!-- ===== Print target ===== -->
<!-- ===== Sign-in gate: nothing behind it is usable until a staff member has signed in ===== -->
<div id="authGate" role="dialog" aria-modal="true" aria-label="Staff sign-in"
     class="fixed inset-0 hidden items-center justify-center overflow-y-auto p-4 backdrop-blur-md"
     style="z-index:65;background:rgba(246,248,246,.97)">
  <div class="glass modal-in w-full max-w-md rounded-[28px] p-5">
    <div class="flex items-center gap-3">
      <div class="flex h-12 w-12 flex-none items-center justify-center rounded-[16px] text-white"
           style="background:linear-gradient(135deg,#58b5a7,#2f8b7f);box-shadow:0 8px 18px -10px rgba(37,120,110,.9),inset 0 1px 0 rgba(255,255,255,.35)">
        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12zM7.5 12h2.25l1.5-3 2 5 1.5-2h2.25"/></svg>
      </div>
      <div class="leading-tight">
        <div class="display text-[18px] font-extrabold tracking-tight text-[#123033]">Health Expo Passport</div>
      </div>
    </div>
    <div id="authGateBody" class="mt-4"></div>
  </div>
</div>

<div id="printArea"></div>

<!-- ===== Toast ===== -->
<div id="toast" role="status" aria-live="polite" class="pointer-events-none fixed bottom-28 left-1/2 z-[60] -translate-x-1/2 translate-y-3 opacity-0 transition-all duration-300">
  <div class="flex items-center gap-2 rounded-2xl px-4 py-2.5 text-xs font-bold text-white"
       style="background:linear-gradient(135deg,rgba(31,77,72,.96),rgba(18,48,51,.96));box-shadow:0 18px 40px -18px rgba(16,60,58,.9);backdrop-filter:blur(12px)">
    <span class="h-2 w-2 rounded-full bg-brand-300"></span><span id="toastMsg"></span>
    <button id="toastUndo" class="hidden" style="pointer-events:auto;background:rgba(255,255,255,.15);border:0;border-radius:9999px;padding:4px 10px;font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;color:#9fd8cc;cursor:pointer">Undo</button>
  </div>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
